name: Desktop Release

# Builds the Windows desktop installer (docs/adr/0009-desktop-app-shell.md).
#
# - After "Auto Release" succeeds on main: if that run produced a release (HEAD of main is tagged
#   vX.Y.Z), build the installer and attach it to that GitHub Release. auto-release.yml is not
#   modified, and a failure here cannot affect its Firebase deploy or version bump.
#   (workflow_run is used because tags pushed with GITHUB_TOKEN do not trigger tag workflows.)
# - On manual runs and on pushes to develop that touch the desktop shell: build only and keep the
#   installer as a workflow artifact, never as a release asset.

on:
  workflow_run:
    workflows: ['Auto Release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-release.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release builds only: HEAD of main must be the tagged release commit.
      - name: Find release tag
        id: release
        shell: bash
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch origin main --tags --force
            TAG=$(git tag --points-at HEAD --list 'v*' | head -n1)
            if [ -z "$TAG" ]; then
              echo "HEAD is not a tagged release (no version bump) - nothing to build."
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$([ "${{ github.event_name }}" != "workflow_run" ] || [ -n "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.release.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.build == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.build == 'true'
        with:
          workspaces: src-tauri

      # Scripts are skipped: only the Tauri CLI binary is needed, not husky or the postinstall hook.
      - name: Install dependencies
        if: steps.release.outputs.build == 'true'
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build installer
        if: steps.release.outputs.build == 'true'
        run: npm run desktop:build

      - name: Collect installer and checksum
        id: pack
        if: steps.release.outputs.build == 'true'
        shell: bash
        run: |
          mkdir dist-desktop
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-desktop/
          cd dist-desktop
          for f in *-setup.exe; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          EXPECTED=$(node -p "require('../package.json').version")
          TAG="${{ steps.release.outputs.tag }}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version $EXPECTED" >&2
            exit 1
          fi

      - name: Attach to GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist-desktop/*

      - name: Keep as workflow artifact
        if: steps.release.outputs.build == 'true' && steps.release.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-windows-installer
          path: dist-desktop/*
          retention-days: 14
