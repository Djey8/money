<div
  id="addFire-Container"
  role="dialog"
  aria-modal="true"
  appTrapFocus
  *ngIf="isOpen"
  (click)="highlight()"
  [style.z-index]="classReference.zIndex + 1001"
>
  <h4 id="addFireTitle">{{ 'Recurring.addTitle' | translate }}</h4>
  <button id="closebtn" aria-label="Close" (click)="closeWindow()">x</button>
  <hr class="separator-white" />
  <p class="transfer-hint">{{ 'Recurring.hint' | translate }}</p>
  <form id="input-container">
    <label for="title">{{ 'Recurring.name' | translate }}</label>
    <input
      type="text"
      id="title"
      name="title"
      maxlength="100"
      [(ngModel)]="titleTextField"
      [placeholder]="'Recurring.namePlaceholder' | translate"
    />
    <label for="from" class="required">{{ 'Transfer.from' | translate }}</label>
    <select id="from" name="from" [(ngModel)]="fromLocationId">
      <option [ngValue]="null">{{ 'Transfer.choose' | translate }}</option>
      <option *ngFor="let l of locations" [ngValue]="l.id">{{ label(l) }}</option>
    </select>
    <label for="to" class="required">{{ 'Transfer.to' | translate }}</label>
    <select id="to" name="to" [(ngModel)]="toLocationId">
      <option [ngValue]="null">{{ 'Transfer.choose' | translate }}</option>
      <option *ngFor="let l of locations" [ngValue]="l.id">{{ label(l) }}</option>
    </select>
    <label for="amount" class="required">{{ 'Common.amount' | translate }}</label>
    <input
      type="number"
      step="any"
      min="0"
      id="amount"
      name="amount"
      [(ngModel)]="amountTextField"
    />
    <label for="frequency" class="required">{{ 'Subscription.frequency.label' | translate }}</label>
    <select id="frequency" name="frequency" [(ngModel)]="frequencyField">
      <option value="weekly">{{ 'Subscription.frequency.weekly' | translate }}</option>
      <option value="biweekly">{{ 'Subscription.frequency.biweekly' | translate }}</option>
      <option value="monthly">{{ 'Subscription.frequency.monthly' | translate }}</option>
      <option value="quarterly">{{ 'Subscription.frequency.quarterly' | translate }}</option>
      <option value="yearly">{{ 'Subscription.frequency.yearly' | translate }}</option>
    </select>
    <label for="startDate" class="required">{{ 'Recurring.startDate' | translate }}</label>
    <input type="date" id="startDate" name="startDate" [(ngModel)]="startDateTextField" />
    <label for="endDate">{{ 'Recurring.endDate' | translate }}</label>
    <input type="date" id="endDate" name="endDate" [(ngModel)]="endDateTextField" />
    <label for="comment">{{ 'AddTransaction.Comment' | translate }}</label>
    <input
      type="text"
      id="comment"
      name="comment"
      maxlength="200"
      [(ngModel)]="commentTextField"
      class="mb-xs"
    />
  </form>
  <p id="errorLable" *ngIf="classReference.isError">{{ errorTextLable }}</p>
  <button id="addbtn" class="btn btn--action" (click)="addRecurringTransfer()">
    {{ 'Recurring.add' | translate }}
  </button>
</div>
