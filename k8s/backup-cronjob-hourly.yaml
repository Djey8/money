apiVersion: batch/v1
kind: CronJob
metadata:
  name: couchdb-backup-hourly
  namespace: money-app
spec:
  schedule: "0 * * * *"
  # Skip a run rather than queuing if it cannot start within 5 minutes
  startingDeadlineSeconds: 300
  # Never run two hourly backups concurrently
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      # Kill the job if it runs longer than 30 minutes
      activeDeadlineSeconds: 1800
      # Do not retry endlessly on failure
      backoffLimit: 1
      template:
        metadata:
          labels:
            job-type: couchdb-backup
        spec:
          containers:
          - name: backup
            image: alpine:3.21
            securityContext:
              allowPrivilegeEscalation: false
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e

              # Install required tools and ensure libxml2 is updated to patched revision
              apk update >/dev/null 2>&1 || true
              apk add --no-cache curl gnupg coreutils libxml2 > /dev/null 2>&1 || true

              # ── Configuration ──────────────────────────────────
              COUCHDB_HOST="couchdb.money-app.svc.cluster.local"
              COUCHDB_PORT="5984"
              COUCHDB_USER="${COUCHDB_USER:-admin}"
              COUCHDB_PASSWORD="${COUCHDB_PASSWORD}"
              BACKUP_ROOT="/backups"
              NAS_ROOT="/nas-backups"
              DATE=$(date +%Y-%m-%d)
              HOUR=$(date +%H)

              HOURLY_DIR="${BACKUP_ROOT}/hourly"
              HOURLY_FILE="${HOURLY_DIR}/couchdb-backup-${DATE}_${HOUR}00.tar.gz"

              echo "==================================="
              echo "CouchDB Hourly Backup - $(date)"
              echo "==================================="

              mkdir -p "${HOURLY_DIR}" "${BACKUP_ROOT}/temp"

              # NAS dirs (may be unavailable)
              NAS_AVAILABLE=false
              NAS_DAILY_DIR="${NAS_ROOT}/daily"
              NAS_WEEKLY_DIR="${NAS_ROOT}/weekly"
              NAS_MONTHLY_DIR="${NAS_ROOT}/monthly"
              if [ -d "${NAS_ROOT}" ] && touch "${NAS_ROOT}/.healthcheck" 2>/dev/null; then
                rm -f "${NAS_ROOT}/.healthcheck"
                NAS_AVAILABLE=true
                mkdir -p "${NAS_DAILY_DIR}" "${NAS_WEEKLY_DIR}" "${NAS_MONTHLY_DIR}"
              fi

              # ── Fetch database list ────────────────────────────
              echo "Fetching database list..."
              RAW=$(curl -sf -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" \
                "http://${COUCHDB_HOST}:${COUCHDB_PORT}/_all_dbs") || { echo "Failed to fetch DB list"; exit 1; }

              DATABASES=$(echo "$RAW" | tr -d '[]"' | tr ',' '\n' | grep -v '^_')

              if [ -z "$DATABASES" ]; then
                echo "ERROR: No user databases found — aborting."
                exit 1
              fi

              echo "Databases to backup:"
              echo "$DATABASES" | sed 's/^/  /'

              # ── Backup each database ───────────────────────────
              cd "${BACKUP_ROOT}/temp"
              for db in $DATABASES; do
                echo "Backing up: ${db}"
                curl -sf -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" \
                  "http://${COUCHDB_HOST}:${COUCHDB_PORT}/${db}/_all_docs?include_docs=true" \
                  -o "${db}.json"
                echo "  OK ($(wc -c < "${db}.json") bytes)"
              done

              # Metadata
              cat > backup-metadata.json <<METAEOF
              {
                "date": "${DATE}",
                "hour": "${HOUR}",
                "timestamp": "$(date -Iseconds)",
                "databases": "$(echo $DATABASES | tr '\n' ' ')",
                "type": "hourly"
              }
              METAEOF

              # ── Create archive ─────────────────────────────────
              echo "Creating archive..."
              tar -czf "${HOURLY_FILE}" -C "${BACKUP_ROOT}/temp" .
              rm -rf "${BACKUP_ROOT}/temp"

              # ── Compare hash with previous backup ──────────────
              LATEST_BACKUP=$(ls -1t "${HOURLY_DIR}"/couchdb-backup-*.tar.gz* 2>/dev/null | grep -v "${HOURLY_FILE}" | head -n1 || true)
              if [ -n "$LATEST_BACKUP" ] && [ -f "$LATEST_BACKUP" ]; then
                NEW_HASH=$(sha256sum "${HOURLY_FILE}" | awk '{print $1}')
                OLD_HASH=$(sha256sum "$LATEST_BACKUP" | awk '{print $1}')
                if [ "$NEW_HASH" = "$OLD_HASH" ]; then
                  echo "No changes since last backup (hash match). Skipping backup."
                  rm -f "${HOURLY_FILE}"
                  exit 0
                fi
              fi

              # ── Encrypt archive if key is provided ─────────────
              if [ -n "${BACKUP_ENCRYPTION_KEY}" ]; then
                echo "Encrypting backup..."
                gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "${BACKUP_ENCRYPTION_KEY}" \
                  --output "${HOURLY_FILE}.gpg" "${HOURLY_FILE}"
                rm -f "${HOURLY_FILE}"
                HOURLY_FILE="${HOURLY_FILE}.gpg"
                echo "Backup encrypted with AES-256"
              fi

              SIZE=$(wc -c < "${HOURLY_FILE}")
              echo "Hourly backup: ${HOURLY_FILE} (${SIZE} bytes)"

              # ── Retention: keep last 24 ────────────────────────
              COUNT=$(ls -1 "${HOURLY_DIR}"/couchdb-backup-*.tar.gz* 2>/dev/null | wc -l)
              if [ "$COUNT" -gt 24 ]; then
                echo "Cleaning hourly (keeping last 24)..."
                ls -1t "${HOURLY_DIR}"/couchdb-backup-*.tar.gz* | tail -n +25 | while read f; do
                  echo "  Removing: $(basename "$f")"
                  rm -f "$f"
                done
              fi

              # ── Retry missing backups per user policy ──
              # Daily: recreate today's and yesterday's daily backups if missing
              TODAY=$(date +%Y-%m-%d)
              YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
              for DATE_CAND in "$TODAY" "$YESTERDAY"; do
                if ! ls "${BACKUP_ROOT}/daily"/couchdb-backup-"${DATE_CAND}".tar.gz* >/dev/null 2>&1; then
                  HOURLY_SRC=$(ls -1t "${HOURLY_DIR}"/couchdb-backup-"${DATE_CAND}"_*.tar.gz* 2>/dev/null | head -n1)
                  if [ -f "$HOURLY_SRC" ]; then
                    BASENAME=$(basename "$HOURLY_SRC")
                    DAILY_NAME=$(echo "$BASENAME" | sed -E 's/_[0-9]{2}00//')
                    cp "$HOURLY_SRC" "${BACKUP_ROOT}/daily/${DAILY_NAME}"
                    echo "Recreated daily backup for ${DATE_CAND} from ${BASENAME}"
                    if [ "$NAS_AVAILABLE" = true ]; then
                      cp "${BACKUP_ROOT}/daily/${DAILY_NAME}" "${NAS_DAILY_DIR}/${DAILY_NAME}"
                      echo "Also copied recreated daily backup to NAS: ${DAILY_NAME}"
                    fi
                  else
                    echo "No hourly archive available to recreate daily for ${DATE_CAND}"
                  fi
                else
                  echo "Daily backup exists for ${DATE_CAND}, skipping."
                fi
              done

              # Weekly: recreate last week's Sunday backup if missing
              LAST_WEEK_SUN=$(date -d "last sunday -7 days" +%Y-%m-%d)
              if ! ls "${BACKUP_ROOT}/weekly"/couchdb-backup-"${LAST_WEEK_SUN}".tar.gz* >/dev/null 2>&1; then
                if ls "${BACKUP_ROOT}/daily"/couchdb-backup-"${LAST_WEEK_SUN}".tar.gz* >/dev/null 2>&1; then
                  SRC=$(ls -1t "${BACKUP_ROOT}/daily"/couchdb-backup-"${LAST_WEEK_SUN}".tar.gz* | head -n1)
                  cp "$SRC" "${BACKUP_ROOT}/weekly/$(basename "$SRC")"
                  echo "Recreated weekly backup for ${LAST_WEEK_SUN} from daily"
                  if [ "$NAS_AVAILABLE" = true ]; then
                    cp "$SRC" "${NAS_WEEKLY_DIR}/$(basename "$SRC")"
                    echo "Also copied recreated weekly backup to NAS"
                  fi
                else
                  HOURLY_SRC=$(ls -1t "${HOURLY_DIR}"/couchdb-backup-"${LAST_WEEK_SUN}"_*.tar.gz* 2>/dev/null | head -n1)
                  if [ -f "$HOURLY_SRC" ]; then
                    WEEKLY_BASENAME=$(basename "$HOURLY_SRC" | sed -E 's/_[0-9]{2}00//')
                    cp "$HOURLY_SRC" "${BACKUP_ROOT}/weekly/${WEEKLY_BASENAME}"
                    echo "Recreated weekly backup for ${LAST_WEEK_SUN} from hourly"
                    if [ "$NAS_AVAILABLE" = true ]; then
                      cp "${BACKUP_ROOT}/weekly/${WEEKLY_BASENAME}" "${NAS_WEEKLY_DIR}/${WEEKLY_BASENAME}"
                      echo "Also copied recreated weekly backup to NAS"
                    fi
                  else
                    echo "No source hourly/daily available to recreate weekly backup for ${LAST_WEEK_SUN}"
                  fi
                fi
              else
                echo "Weekly backup exists for ${LAST_WEEK_SUN}, skipping."
              fi

              # Monthly: recreate last month's first day if missing
              LAST_MONTH_START=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m-01)
              if ! ls "${BACKUP_ROOT}/monthly"/couchdb-backup-"${LAST_MONTH_START}".tar.gz* >/dev/null 2>&1; then
                if ls "${BACKUP_ROOT}/daily"/couchdb-backup-"${LAST_MONTH_START}".tar.gz* >/dev/null 2>&1; then
                  SRC=$(ls -1t "${BACKUP_ROOT}/daily"/couchdb-backup-"${LAST_MONTH_START}".tar.gz* | head -n1)
                  MNAME=$(basename "$SRC")
                  cp "$SRC" "${BACKUP_ROOT}/monthly/${MNAME}"
                  echo "Recreated monthly backup for ${LAST_MONTH_START} from daily"
                  if [ "$NAS_AVAILABLE" = true ]; then
                    cp "${BACKUP_ROOT}/monthly/${MNAME}" "${NAS_MONTHLY_DIR}/${MNAME}"
                    echo "Also copied recreated monthly backup to NAS"
                  fi
                else
                  HOURLY_SRC=$(ls -1t "${HOURLY_DIR}"/couchdb-backup-"${LAST_MONTH_START}"_*.tar.gz* 2>/dev/null | head -n1)
                  if [ -f "$HOURLY_SRC" ]; then
                    MONTHLY_BASENAME=$(basename "$HOURLY_SRC" | sed -E 's/_[0-9]{2}00//')
                    cp "$HOURLY_SRC" "${BACKUP_ROOT}/monthly/${MONTHLY_BASENAME}"
                    echo "Recreated monthly backup for ${LAST_MONTH_START} from hourly"
                    if [ "$NAS_AVAILABLE" = true ]; then
                      cp "${BACKUP_ROOT}/monthly/${MONTHLY_BASENAME}" "${NAS_MONTHLY_DIR}/${MONTHLY_BASENAME}"
                      echo "Also copied recreated monthly backup to NAS"
                    fi
                  else
                    echo "No source hourly/daily available to recreate monthly backup for ${LAST_MONTH_START}"
                  fi
                fi
              else
                echo "Monthly backup exists for ${LAST_MONTH_START}, skipping."
              fi

              echo ""
              echo "Hourly backups: $(ls -1 "${HOURLY_DIR}"/couchdb-backup-*.tar.gz* 2>/dev/null | wc -l) (max 24)"
              echo "Hourly backup completed!"
            env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: password
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-encryption-secret
                  key: encryption-key
                  optional: true
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            hostPath:
              path: /opt/money-app-backups
              type: DirectoryOrCreate
