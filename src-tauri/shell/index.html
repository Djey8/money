<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
        color: #1d2733;
      }
      main {
        width: min(420px, 90vw);
        background: #fff;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.3rem;
      }
      p {
        margin: 0 0 16px;
        color: #5b6772;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #c3ccd5;
        border-radius: 8px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        border: 0;
        border-radius: 8px;
        background: #1a6ed8;
        color: #fff;
        cursor: pointer;
      }
      #error {
        color: #b3261e;
        margin-top: 10px;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to your server</h1>
      <p>
        Enter the address of your self-hosted Money Manager, e.g. https://money.example.com or
        http://localhost:8080
      </p>
      <form id="form">
        <input id="url" type="url" placeholder="https://money.example.com" required autofocus />
        <button type="submit">Connect</button>
      </form>
      <div id="error"></div>
    </main>
    <script>
      const KEY = 'mm.serverUrl';
      const input = document.getElementById('url');
      const error = document.getElementById('error');
      const saved = localStorage.getItem(KEY);
      const changing = new URLSearchParams(location.search).has('change');

      if (saved) input.value = saved;
      if (saved && !changing) location.replace(saved);

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const url = input.value.trim().replace(/\/+$/, '');
        error.textContent = 'Checking…';
        try {
          await fetch(url + '/', { mode: 'no-cors' });
        } catch {
          error.textContent = 'Could not reach that address. Check the URL and your network.';
          return;
        }
        localStorage.setItem(KEY, url);
        location.replace(url);
      });
    </script>
  </body>
</html>
