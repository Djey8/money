openapi: 3.1.0
info:
  title: Money Manager Pro API
  version: 1.0.0-draft
servers:
  - url: /api/v1
paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      description: Returns the caller's transactions in integer minor units. Existing records must first receive stable IDs through `mm-admin migrate-transaction-ids`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: account
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, amount]
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Transactions owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTransaction'
              example:
                transactions:
                  - id: tx_01234567-89ab-cdef-0123-456789abcdef
                    account: Daily
                    amountMinor: -1250
                    currency: EUR
                    date: '2026-09-06'
                    time: '09:30'
                    category: '@Groceries'
                    comment: Weekly shop
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: createTransaction
      summary: Create a transaction
      description: Adds a transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              account: Daily
              amountMinor: -1250
              date: '2026-09-06'
              time: '09:30'
              category: '@Groceries'
              comment: Weekly shop
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /transactions/export:
    get:
      operationId: exportTransactions
      summary: Export all transactions as newline-delimited JSON
      description: Returns every transaction owned by the caller, one JSON object per line (no pagination, no filters), for full-account moves. Requires `transactions:bulk`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Newline-delimited JSON, one ApiTransaction per line
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |-
                {"id":"tx_01234567-89ab-cdef-0123-456789abcdef","account":"Daily","amountMinor":-1250,"currency":"EUR","date":"2026-09-06","time":"09:30","category":"@Groceries","comment":"Weekly shop"}
                {"id":"tx_11111111-89ab-cdef-0123-456789abcdef","account":"Income","amountMinor":250000,"currency":"EUR","date":"2026-09-01","time":"08:00","category":"@Salary","comment":""}
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /transactions/import:
    post:
      operationId: importTransactions
      summary: Bulk-create transactions from newline-delimited JSON
      description: >-
        Creates one transaction per line of the request body (each line the same shape as CreateTransactionRequest).
        Requires `transactions:bulk` and an `Idempotency-Key` header — hashed from the raw request body, not a
        re-serialized JSON value like batch, so byte-identical replay is required (see docs/api/AGENTS.md) — with
        the same replay/mismatch contract and the same known write-then-record ordering gap as
        `POST /transactions/batch`. Up to 10,000 lines of at most 16KB each per call. `?atomic=true` makes the whole
        import all-or-nothing, same as batch's `atomic` flag; the default applies what parses and validates,
        reporting the rest per line as `error`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: atomic
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |-
              {"account":"Daily","amountMinor":-850,"date":"2026-09-07","time":"08:15","category":"@Coffee","comment":""}
              {"account":"Income","amountMinor":250000,"date":"2026-09-01","time":"08:00","category":"@Salary","comment":""}
      responses:
        '200':
          description: Per-line results, in the same shape as a batch response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransactionsResponse'
              example:
                idempotencyKey: 2026-09-07-restore
                atomic: false
                itemCount: 2
                results:
                  - op: create
                    status: created
                    id: tx_22222222-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_22222222-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amountMinor: -850
                      currency: EUR
                      date: '2026-09-07'
                      time: '08:15'
                      category: '@Coffee'
                      comment: ''
                  - op: create
                    status: created
                    id: tx_33333333-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_33333333-89ab-cdef-0123-456789abcdef
                      account: Income
                      amountMinor: 250000
                      currency: EUR
                      date: '2026-09-01'
                      time: '08:00'
                      category: '@Salary'
                      comment: ''
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /transactions/batch:
    post:
      operationId: batchTransactions
      summary: Create, update, or delete many transactions in one request
      description: >-
        Applies a mix of create/update/delete operations atomically at the storage level (one document write) and
        rebuilds derived income/expense/Smile/Fire/Mojo state once. Requires the `transactions:bulk` scope and an
        `Idempotency-Key` header — replaying the same key with the same body returns the original result without
        reapplying it; replaying it with a different body is rejected. The write and the idempotency record are not
        one atomic transaction: a crash between them (rare) can make a same-key retry reapply the batch — see
        docs/api/AGENTS.md. Setting `atomic` to true makes the whole batch all-or-nothing (if any operation fails,
        none are applied, and a would-have-succeeded `create`'s `id` in the response was never persisted); the
        default, false, applies what succeeds and reports failures per item.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransactionsRequest'
            example:
              atomic: false
              operations:
                - op: create
                  account: Daily
                  amountMinor: -850
                  date: '2026-09-07'
                  time: '08:15'
                  category: '@Coffee'
                  comment: ''
                - op: update
                  id: tx_01234567-89ab-cdef-0123-456789abcdef
                  amountMinor: -1500
                - op: delete
                  id: tx_11111111-89ab-cdef-0123-456789abcdef
      responses:
        '200':
          description: Per-item results (some items may report `error` even on a 200, in non-atomic mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransactionsResponse'
              example:
                idempotencyKey: 2026-09-07-morning-batch
                atomic: false
                itemCount: 3
                results:
                  - op: create
                    status: created
                    id: tx_22222222-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_22222222-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amountMinor: -850
                      currency: EUR
                      date: '2026-09-07'
                      time: '08:15'
                      category: '@Coffee'
                      comment: ''
                  - op: update
                    status: error
                    id: tx_01234567-89ab-cdef-0123-456789abcdef
                    error: No matching transaction exists.
                  - op: delete
                    status: deleted
                    id: tx_11111111-89ab-cdef-0123-456789abcdef
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /transactions/{transactionId}/copy:
    post:
      operationId: copyTransaction
      summary: Copy a transaction
      description: Creates a new transaction from an existing one's account, amount, category, and comment. Date and time default to now, matching the UI's copy behavior; any field may be overridden in the request body. Atomically rebuilds derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTransactionRequest'
            example:
              date: '2026-09-07'
      responses:
        '201':
          description: The newly created copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_11111111-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-07'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Get one transaction
      description: Returns a single transaction owned by the caller in integer minor units.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTransaction
      summary: Edit a transaction
      description: Updates one or more fields on an existing transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state. If the transaction's comment carries a `#bucket:` allocation tag (current or incoming), `amountMinor` and `comment` must be provided together — sending only one is rejected rather than silently applied against the other field's stale value.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
            example:
              amountMinor: -1500
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1500
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction
      description: Removes a transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/income-statement:
    get:
      operationId: getIncomeStatement
      summary: Get the income statement for a period
      description: >-
        Computes revenues, interest/property/other income, per-account expenses, net result, and savings rate for one
        period, plus the same figures for the immediately preceding period of the same length. Inter-account
        transfers (Income→Daily/Splurge/Smile/Fire/Mojo) are excluded from both sides, matching
        `src/app/stats/statement/statement-calculations.ts` — see PLAN.md D-22 for why this differs from the
        `src/app/main/cashflow/*` components' own (buggy, out-of-scope) calculation.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Income statement for the requested period and the one before it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeStatement'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                revenues: { current: 250000, previous: 250000, changePercent: 0 }
                interests: { current: 500, previous: 0, changePercent: 0 }
                propertyIncome: { current: 0, previous: 0, changePercent: 0 }
                otherIncome: { current: 0, previous: 0, changePercent: 0 }
                totalIncome: { current: 250500, previous: 250000, changePercent: 0.2 }
                expensesByAccount:
                  Daily: { current: 40000, previous: 38000, changePercent: 5.26 }
                  Splurge: { current: 0, previous: 0, changePercent: 0 }
                  Smile: { current: 0, previous: 0, changePercent: 0 }
                  Fire: { current: 0, previous: 0, changePercent: 0 }
                totalExpenses: { current: 40000, previous: 38000, changePercent: 5.26 }
                netResult: { current: 210500, previous: 212000, changePercent: -0.71 }
                savingsRatePercent: { current: 84.03, previous: 84.8, changePercent: -0.91 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/cashflow:
    get:
      operationId: getCashflow
      summary: Get the cashflow statement for a period
      description: >-
        Splits all activity in one period into operating, investing (transfers into Smile/Fire), financing
        (liability paybacks, detected via a `payback liabilitie` comment substring), and mojo (Mojo contributions),
        plus net cashflow, for the requested period and the one before it. Matches
        `src/app/stats/statement/statement-calculations.ts`'s `computeCashflow` — see PLAN.md D-22. Unlike
        `/reports/income-statement`, this classifies every transaction regardless of account, not only
        Income/expense-account activity.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Cashflow statement for the requested period and the one before it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowStatement'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                operating: { current: 210500, previous: 212000, changePercent: -0.71 }
                investing: { current: 30000, previous: 20000, changePercent: 50 }
                financing: { current: 15000, previous: 0, changePercent: 0 }
                mojo: { current: 5000, previous: 5000, changePercent: 0 }
                netCashflow: { current: 160500, previous: 187000, changePercent: -14.17 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      summary: Get the current balance sheet
      description: >-
        A current snapshot of assets, liabilities, and equity — not period-scoped, unlike the other report
        endpoints, matching `computeBalanceSheet` in `src/app/stats/statement/statement-calculations.ts` (canonical
        per PLAN.md D-22). `assets.shares` is each share's `quantity × price`; `assets.investments` is each
        investment's `amount + deposit`; `equity`/`netWorth` is total assets minus total liabilities and can be
        negative.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current balance sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheet'
              example:
                assets:
                  cash: 800000
                  shares: 415000
                  investments: 21000000
                  properties: 80000
                  total: 22295000
                liabilities:
                  debts: 15000000
                  total: 15000000
                equity: 7295000
                netWorth: 7295000
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/kpis:
    get:
      operationId: getKpis
      summary: Get key ratios, top categories, and both KPI-dashboard variants for a period
      description: >-
        Ports `computeRatiosForRange`/`topCategories` from `src/app/stats/statement/statement-calculations.ts`
        (`ratios`/`previousRatios`/`topExpenses`/`topIncomes`) plus, per PLAN.md D-7/D-23,
        `dashboardSavingsRatePercent` and `dashboardFixedCostRatioPercent` — a second, genuinely different pair of
        formulas from `src/app/stats/stats-calculations.ts`'s KPI dashboard (STATS-1). The two savings-rate values
        and the two fixed-cost-ratio values are each independently computed and exposed distinctly named on purpose
        — see `docs/domain/KPI_FORMULAS.md` for their exact formulas and where/why they diverge.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: KPI ratios, top categories, and dashboard-formula ratios for the requested period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiReport'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                ratios:
                  savingsRatePercent: 84.03
                  fixedCostRatioPercent: 32.5
                  netMarginPercent: 84.03
                  debtRatio: 0.4
                  equityRatioPercent: 42.86
                  interestCoverage: 5.2
                previousRatios:
                  savingsRatePercent: 84.8
                  fixedCostRatioPercent: 30.1
                  netMarginPercent: 84.8
                  debtRatio: 0.41
                  equityRatioPercent: 41.9
                  interestCoverage: 4.9
                dashboardSavingsRatePercent: 82.1
                previousDashboardSavingsRatePercent: 83.4
                dashboardFixedCostRatioPercent: 29.8
                previousDashboardFixedCostRatioPercent: 28.2
                topExpenses:
                  - category: Groceries
                    amountMinor: 45000
                    percent: 62.5
                  - category: Fun
                    amountMinor: 27000
                    percent: 37.5
                topIncomes:
                  - category: Salary
                    amountMinor: 250000
                    percent: 100
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /me:
    get:
      operationId: getCurrentIdentity
      summary: Get the current API identity
      description: Returns the current user's ID, authentication type, and effective scopes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                userId: user_123
                authenticationType: token
                tokenName: household-agent
                scopes: [transactions:rw, reports:r]
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List personal access tokens
      description: Requires an authenticated account session. PATs cannot manage tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens owned by the current user
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
              example:
                tokens:
                  - tokenId: pat_0123456789abcdef0123456789abcdef
                    name: household-agent
                    scopes: [transactions:rw]
                    createdAt: '2026-09-06T20:00:00.000Z'
                    expiresAt: null
                    revoked: false
        '403':
          $ref: '#/components/responses/SessionRequired'
    post:
      operationId: createPersonalAccessToken
      summary: Create a personal access token
      description: Requires an authenticated account session. The plaintext token is returned exactly once; browser-issued tokens cannot receive the admin scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
            example:
              name: household-agent
              scopes: [transactions:rw, reports:r]
              expiresInDays: 90
      responses:
        '201':
          description: Newly created token. Store token securely; it cannot be retrieved again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenMetadata'
                  - type: object
                    required: [token, userId]
                    properties:
                      token:
                        type: string
                        pattern: '^mmpat_[a-f0-9]{64}$'
                      userId:
                        type: string
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                token: mmpat_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                userId: user_123
                name: household-agent
                scopes: [transactions:rw, reports:r]
                expiresAt: '2026-12-05T20:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SessionRequired'
  /auth/tokens/{tokenId}:
    delete:
      operationId: revokePersonalAccessToken
      summary: Revoke a personal access token
      description: Requires an authenticated account session and only revokes a token owned by that user.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                revoked: true
        '403':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Identity:
      type: object
      required: [userId, authenticationType, scopes]
      properties:
        userId:
          type: string
        authenticationType:
          type: string
          enum: [session, token]
        tokenName:
          type: string
        scopes:
          type: array
          items:
            type: string
    TokenMetadata:
      type: object
      required: [tokenId, name, scopes, createdAt, expiresAt, revoked]
      properties:
        tokenId:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        expiresInDays:
          type: integer
          minimum: 1
    ApiTransaction:
      type: object
      required: [id, account, amountMinor, currency, date, time, category, comment]
      properties:
        id:
          type: string
        account:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    StatementRow:
      type: object
      required: [current, previous, changePercent]
      description: Amounts are integer minor units. `changePercent` is the relative change of `current` vs `previous` (e.g. 20 → 25 is `25`, not `5`); it is `0` when `previous` is `0`.
      properties:
        current:
          type: integer
        previous:
          type: integer
        changePercent:
          type: number
    IncomeStatement:
      type: object
      required:
        - period
        - previousPeriod
        - revenues
        - interests
        - propertyIncome
        - otherIncome
        - totalIncome
        - expensesByAccount
        - totalExpenses
        - netResult
        - savingsRatePercent
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        revenues:
          $ref: '#/components/schemas/StatementRow'
        interests:
          $ref: '#/components/schemas/StatementRow'
        propertyIncome:
          $ref: '#/components/schemas/StatementRow'
        otherIncome:
          $ref: '#/components/schemas/StatementRow'
        totalIncome:
          $ref: '#/components/schemas/StatementRow'
        expensesByAccount:
          type: object
          required: [Daily, Splurge, Smile, Fire]
          properties:
            Daily:
              $ref: '#/components/schemas/StatementRow'
            Splurge:
              $ref: '#/components/schemas/StatementRow'
            Smile:
              $ref: '#/components/schemas/StatementRow'
            Fire:
              $ref: '#/components/schemas/StatementRow'
        totalExpenses:
          $ref: '#/components/schemas/StatementRow'
        netResult:
          $ref: '#/components/schemas/StatementRow'
        savingsRatePercent:
          $ref: '#/components/schemas/StatementRow'
    PeriodRange:
      type: object
      required: [startDate, endDate, label]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
    CashflowStatement:
      type: object
      required: [period, previousPeriod, operating, investing, financing, mojo, netCashflow]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        operating:
          $ref: '#/components/schemas/StatementRow'
        investing:
          $ref: '#/components/schemas/StatementRow'
        financing:
          $ref: '#/components/schemas/StatementRow'
        mojo:
          $ref: '#/components/schemas/StatementRow'
        netCashflow:
          $ref: '#/components/schemas/StatementRow'
    BalanceSheet:
      type: object
      required: [assets, liabilities, equity, netWorth]
      properties:
        assets:
          type: object
          required: [cash, shares, investments, properties, total]
          properties:
            cash:
              type: integer
            shares:
              type: integer
            investments:
              type: integer
            properties:
              type: integer
            total:
              type: integer
        liabilities:
          type: object
          required: [debts, total]
          properties:
            debts:
              type: integer
            total:
              type: integer
        equity:
          type: integer
          description: Total assets minus total liabilities. Can be negative.
        netWorth:
          type: integer
          description: Alias for `equity`.
    KeyRatios:
      type: object
      required:
        - savingsRatePercent
        - fixedCostRatioPercent
        - netMarginPercent
        - debtRatio
        - equityRatioPercent
        - interestCoverage
      properties:
        savingsRatePercent:
          type: number
        fixedCostRatioPercent:
          type: number
        netMarginPercent:
          type: number
          description: Identical formula/value to `savingsRatePercent` — a pre-existing redundancy ported faithfully from the original.
        debtRatio:
          type: number
          description: liabilities.total / assets.total. Not a percentage.
        equityRatioPercent:
          type: number
        interestCoverage:
          type: number
          description: netResult / interestExpenses. Not a percentage.
    CategoryAggregate:
      type: object
      required: [category, amountMinor, percent]
      properties:
        category:
          type: string
        amountMinor:
          type: integer
        percent:
          type: number
          description: Share of this category within its own top-categories list (expenses vs. incomes are two separate 100% totals).
    KpiReport:
      type: object
      required:
        - period
        - previousPeriod
        - ratios
        - previousRatios
        - dashboardSavingsRatePercent
        - previousDashboardSavingsRatePercent
        - dashboardFixedCostRatioPercent
        - previousDashboardFixedCostRatioPercent
        - topExpenses
        - topIncomes
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        ratios:
          $ref: '#/components/schemas/KeyRatios'
        previousRatios:
          $ref: '#/components/schemas/KeyRatios'
        dashboardSavingsRatePercent:
          type: number
        previousDashboardSavingsRatePercent:
          type: number
        dashboardFixedCostRatioPercent:
          type: number
        previousDashboardFixedCostRatioPercent:
          type: number
        topExpenses:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
        topIncomes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
    CreateTransactionRequest:
      type: object
      required: [account, amountMinor, date, time, category, comment]
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    UpdateTransactionRequest:
      type: object
      minProperties: 1
      description: At least one field must be provided. Unrecognized fields are rejected.
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    CopyTransactionRequest:
      type: object
      description: All fields are optional overrides applied on top of the source transaction. Unrecognized fields are rejected.
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    BatchTransactionOperation:
      type: object
      required: [op]
      description: |
        A `create` operation takes the same fields as `CreateTransactionRequest` plus `op`.
        An `update` operation takes `id` plus one or more of `CreateTransactionRequest`'s fields (partial, like PATCH).
        A `delete` operation takes only `op` and `id`.
      properties:
        op:
          type: string
          enum: [create, update, delete]
        id:
          type: string
          description: Required for update and delete; not accepted for create.
        account:
          type: string
        amountMinor:
          type: integer
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    BatchTransactionsRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchTransactionOperation'
        atomic:
          type: boolean
          default: false
          description: When true, no operation is applied if any operation in the batch fails.
    BatchTransactionResult:
      type: object
      required: [op, status]
      properties:
        op:
          type: string
          enum: [create, update, delete]
        status:
          type: string
          enum: [created, updated, deleted, error, not_applied]
        id:
          type: string
        transaction:
          $ref: '#/components/schemas/ApiTransaction'
        error:
          type: string
    BatchTransactionsResponse:
      type: object
      required: [idempotencyKey, atomic, itemCount, results]
      properties:
        idempotencyKey:
          type: string
        atomic:
          type: boolean
        itemCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchTransactionResult'
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
  responses:
    AuthenticationRequired:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_required
            title: Authentication required
            status: 401
            detail: Provide a session or PAT.
            code: auth_required
    SessionRequired:
      description: An authenticated account session is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_session_required
            title: Session authentication required
            status: 403
            detail: An authenticated account session is required for this operation.
            code: auth_session_required
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/validation_invalid
            title: Invalid token request
            status: 400
            detail: At least one scope is required.
            code: validation_invalid
    InsufficientScope:
      description: The supplied token does not grant the required scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/scope_insufficient
            title: Insufficient scope
            status: 403
            detail: This operation requires the 'transactions:r' scope.
            code: scope_insufficient
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/not_found
            title: Token not found
            status: 404
            detail: No matching token exists.
            code: not_found
    IdempotencyConflict:
      description: The Idempotency-Key was already used for a request with a different body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/conflict_idempotency_mismatch
            title: Idempotency key reused with a different request
            status: 409
            detail: This Idempotency-Key was already used for a request with a different body.
            code: conflict_idempotency_mismatch
