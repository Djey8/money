        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /fire/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFireProject
      summary: Get a single Fire project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Fire project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireProject'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFireProject
      summary: Update a Fire project
      description: >-
        Accepts a partial body — only the fields you send are changed. `buckets`/`links`/`actionItems`/`notes`, when
        sent, each REPLACE the entire array (not a per-item merge) — send the complete list you want, including
        unchanged entries. For `buckets`, echo back an existing bucket's `id` to edit it in place; omit `id` (or use
        one that doesn't match) to add a new bucket — any existing bucket whose `id` isn't present in the new array
        is dropped. For `notes`, echo back an existing note's `createdAt` to preserve it; omit it on a new note to
        get a fresh server timestamp. A changed `title` is checked for an exact-match collision against the
        caller's other Fire projects (not against itself). Moving `phase` to `completed` stamps `completionDate`
        automatically if one isn't already set; it never overwrites an explicit `completionDate` sent in the same
        request, and moving away from `completed` never clears a previously-set `completionDate`. Unlike the
        original UI's edit form, an omitted `completionDate` is never auto-cleared — see `docs/api/AGENTS.md` for
        this deliberate divergence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFireProjectRequest'
