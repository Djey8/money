        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        tag:
          type: string
        amountMinor:
          type: integer
    SettingsAllocation:
      type: object
      required: [daily, splurge, smile, fire]
      description: Must sum to 100.
      properties:
        daily:
          type: number
        splurge:
          type: number
        smile:
          type: number
        fire:
          type: number
    Settings:
      type: object
      required: [username, currency, theme, language, dateFormat, isEuropeanFormat, allocation]
      properties:
        username:
          type: string
        currency:
          type: string
        theme:
          type: string
          enum: [light, dark]
        language:
          type: string
          enum: [en, de, es, fr, cn, ar]
        dateFormat:
          type: string
          enum: [dd.MM.yyyy, dd.MM.yy, dd/MM/yyyy, dd/MM/yy, yyyy-MM-dd, MM/dd/yyyy, dd-MM-yyyy]
        isEuropeanFormat:
          type: boolean
        allocation:
          $ref: '#/components/schemas/SettingsAllocation'
    PatchSettingsRequest:
      type: object
      description: All fields optional — send only what you want to change. allocation, if sent, must include all four sub-fields and sum to 100.
      properties:
        username:
          type: string
        currency:
          type: string
        theme:
          type: string
          enum: [light, dark]
        language:
          type: string
          enum: [en, de, es, fr, cn, ar]
        dateFormat:
          type: string
          enum: [dd.MM.yyyy, dd.MM.yy, dd/MM/yyyy, dd/MM/yy, yyyy-MM-dd, MM/dd/yyyy, dd-MM-yyyy]
        isEuropeanFormat:
          type: boolean
        allocation:
          $ref: '#/components/schemas/SettingsAllocation'
    EncryptionConfig:
      type: object
      required: [encryptLocal, encryptDatabase, keyConfigured]
      properties:
        encryptLocal:
          type: boolean
        encryptDatabase:
          type: boolean
        keyConfigured:
          type: boolean
          description: Whether a real (non-default) key is active. The key value itself is never returned.
    PutEncryptionConfigRequest:
      type: object
      description: All fields optional. `key` may only be set when no key is active yet, or resubmitted unchanged — changing an active key is rejected.
      properties:
        key:
          type: string
        encryptLocal:
          type: boolean
        encryptDatabase:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
  responses:
    AuthenticationRequired:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_required
            title: Authentication required
            status: 401
            detail: Provide a session or PAT.
            code: auth_required
    SessionRequired:
      description: An authenticated account session is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_session_required
            title: Session authentication required
            status: 403
            detail: An authenticated account session is required for this operation.
            code: auth_session_required
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/validation_invalid
            title: Invalid token request
            status: 400
            detail: At least one scope is required.
            code: validation_invalid
    InsufficientScope:
      description: The supplied token does not grant the required scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/scope_insufficient
            title: Insufficient scope
            status: 403
            detail: This operation requires the 'transactions:r' scope.
            code: scope_insufficient
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/not_found
            title: Token not found
            status: 404
            detail: No matching token exists.
            code: not_found
    IdempotencyConflict:
      description: The Idempotency-Key was already used for a request with a different body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/conflict_idempotency_mismatch
            title: Idempotency key reused with a different request
            status: 409
            detail: This Idempotency-Key was already used for a request with a different body.
            code: conflict_idempotency_mismatch
