          items:
            $ref: '#/components/schemas/FundNote'
        plannedSubscriptions:
          type: array
          description: Payment plans created via POST /fire/{id}/payment-plan.
          items:
            $ref: '#/components/schemas/PaymentPlan'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateFireProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
          default: idea
        description:
          type: string
        targetDate:
          type: string
          format: date
        targetMinor:
          type: integer
          description: Creates a single default bucket named after `title`. Either this or a non-empty `buckets` is required.
        amountMinor:
          type: integer
          description: Only used together with `targetMinor`; defaults to 0.
        buckets:
          type: array
          items:
            type: object
            required: [title, targetMinor]
            properties:
              title:
                type: string
              targetMinor:
                type: integer
              amountMinor:
                type: integer
                default: 0
              notes:
                type: string
              targetDate:
                type: string
