    CreatePaymentPlanRequest:
      type: object
      required: [planTitle, startDate, targetDate, frequency, account]
      properties:
        planTitle:
          type: string
        selectedBucketIds:
          type: array
          items:
            type: string
          description: Bucket ids to fund; omit or send an empty array to fund every bucket (smart proportional allocation across all of them). Every id must reference an existing bucket on this project.
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: The date by which the buckets should be fully funded — used to compute the number of payment periods.
        frequency:
          type: string
          enum: [weekly, biweekly, monthly, quarterly, yearly]
        account:
          type: string
        manualAmountMinor:
          type: integer
          description: Overrides the calculated per-period amount when provided. The calculated amount is still returned as originalCalculatedAmountMinor.
    PaymentPlan:
      type: object
      required:
        - id
        - title
        - status
        - projectType
        - projectTitle
        - account
        - amountMinor
        - startDate
        - endDate
        - category
        - comment
        - frequency
        - targetDate
        - targetBucketIds
        - originalCalculatedAmountMinor
        - manuallyAdjusted
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [planned]
          description: Always "planned" for a freshly-created plan — activating a plan into a real recurring subscription isn't exposed by this API.
        projectType:
          type: string
          enum: [smile, fire]
        projectTitle:
          type: string
        account:
          type: string
        amountMinor:
          type: integer
          description: The per-period payment amount actually used — either the calculated amount, or manualAmountMinor if one was sent.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        category:
          type: string
          description: "`@<projectTitle>` — matches this project's transactions by category, same convention as every other entity."
        comment:
          type: string
          description: "`#bucket:Title:Amount` tags describing how amountMinor is allocated across the funded buckets — the same DSL a transaction's comment uses."
        frequency:
          type: string
          enum: [weekly, biweekly, monthly, quarterly, yearly]
        targetDate:
          type: string
          format: date
        targetBucketIds:
          type: array
          items:
            type: string
        originalCalculatedAmountMinor:
          type: integer
          description: The calculated amount before any manual override — always present, even when manuallyAdjusted is true.
        manuallyAdjusted:
          type: boolean
          description: True only when manualAmountMinor was sent and differed from originalCalculatedAmountMinor.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
