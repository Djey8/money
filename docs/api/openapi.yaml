        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      operationId: getCurrentIdentity
      summary: Get the current API identity
      description: Returns the current user's ID, authentication type, and effective scopes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                userId: user_123
                authenticationType: token
                tokenName: household-agent
                scopes: [transactions:rw, reports:r]
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List personal access tokens
      description: Requires an authenticated account session. PATs cannot manage tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens owned by the current user
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
              example:
                tokens:
                  - tokenId: pat_0123456789abcdef0123456789abcdef
                    name: household-agent
                    scopes: [transactions:rw]
                    createdAt: '2026-09-06T20:00:00.000Z'
                    expiresAt: null
                    revoked: false
        '403':
          $ref: '#/components/responses/SessionRequired'
    post:
      operationId: createPersonalAccessToken
      summary: Create a personal access token
      description: Requires an authenticated account session. The plaintext token is returned exactly once; browser-issued tokens cannot receive the admin scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
            example:
              name: household-agent
              scopes: [transactions:rw, reports:r]
              expiresInDays: 90
      responses:
        '201':
          description: Newly created token. Store token securely; it cannot be retrieved again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenMetadata'
                  - type: object
                    required: [token, userId]
                    properties:
                      token:
                        type: string
                        pattern: '^mmpat_[a-f0-9]{64}$'
                      userId:
                        type: string
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                token: mmpat_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                userId: user_123
                name: household-agent
                scopes: [transactions:rw, reports:r]
                expiresAt: '2026-12-05T20:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SessionRequired'
  /auth/tokens/{tokenId}:
    delete:
      operationId: revokePersonalAccessToken
      summary: Revoke a personal access token
      description: Requires an authenticated account session and only revokes a token owned by that user.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                revoked: true
        '403':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Identity:
      type: object
      required: [userId, authenticationType, scopes]
      properties:
        userId:
          type: string
        authenticationType:
          type: string
          enum: [session, token]
        tokenName:
          type: string
        scopes:
          type: array
          items:
            type: string
    TokenMetadata:
      type: object
      required: [tokenId, name, scopes, createdAt, expiresAt, revoked]
      properties:
        tokenId:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        expiresInDays:
          type: integer
          minimum: 1
    ApiTransaction:
      type: object
      required: [id, account, amountMinor, currency, date, time, category, comment]
      properties:
        id:
          type: string
        account:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    StatementRow:
      type: object
      required: [current, previous, changePercent]
      description: Amounts are integer minor units. `changePercent` is the relative change of `current` vs `previous` (e.g. 20 → 25 is `25`, not `5`); it is `0` when `previous` is `0`.
      properties:
        current:
          type: integer
        previous:
          type: integer
        changePercent:
          type: number
    IncomeStatement:
      type: object
      required:
        - period
        - previousPeriod
        - revenues
        - interests
        - propertyIncome
        - otherIncome
        - totalIncome
        - expensesByAccount
        - totalExpenses
        - netResult
        - savingsRatePercent
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        revenues:
          $ref: '#/components/schemas/StatementRow'
        interests:
          $ref: '#/components/schemas/StatementRow'
        propertyIncome:
          $ref: '#/components/schemas/StatementRow'
        otherIncome:
          $ref: '#/components/schemas/StatementRow'
        totalIncome:
          $ref: '#/components/schemas/StatementRow'
        expensesByAccount:
          type: object
          required: [Daily, Splurge, Smile, Fire]
          properties:
            Daily:
              $ref: '#/components/schemas/StatementRow'
            Splurge:
              $ref: '#/components/schemas/StatementRow'
            Smile:
              $ref: '#/components/schemas/StatementRow'
            Fire:
              $ref: '#/components/schemas/StatementRow'
        totalExpenses:
          $ref: '#/components/schemas/StatementRow'
        netResult:
          $ref: '#/components/schemas/StatementRow'
        savingsRatePercent:
          $ref: '#/components/schemas/StatementRow'
    PeriodRange:
      type: object
      required: [startDate, endDate, label]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
    CashflowStatement:
      type: object
      required: [period, previousPeriod, operating, investing, financing, mojo, netCashflow]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        operating:
          $ref: '#/components/schemas/StatementRow'
        investing:
          $ref: '#/components/schemas/StatementRow'
        financing:
          $ref: '#/components/schemas/StatementRow'
        mojo:
          $ref: '#/components/schemas/StatementRow'
        netCashflow:
          $ref: '#/components/schemas/StatementRow'
    BalanceSheet:
      type: object
      required: [assets, liabilities, equity, netWorth]
      properties:
        assets:
          type: object
          required: [cash, shares, investments, properties, total]
          properties:
            cash:
              type: integer
            shares:
              type: integer
            investments:
              type: integer
            properties:
              type: integer
            total:
              type: integer
        liabilities:
          type: object
          required: [debts, total]
          properties:
            debts:
              type: integer
            total:
              type: integer
        equity:
          type: integer
          description: Total assets minus total liabilities. Can be negative.
        netWorth:
          type: integer
          description: Alias for `equity`.
    KeyRatios:
      type: object
      required:
        - savingsRatePercent
        - fixedCostRatioPercent
        - netMarginPercent
        - debtRatio
        - equityRatioPercent
        - interestCoverage
      properties:
        savingsRatePercent:
          type: number
        fixedCostRatioPercent:
          type: number
        netMarginPercent:
          type: number
          description: Identical formula/value to `savingsRatePercent` — a pre-existing redundancy ported faithfully from the original.
        debtRatio:
          type: number
          description: liabilities.total / assets.total. Not a percentage.
        equityRatioPercent:
          type: number
        interestCoverage:
          type: number
          description: netResult / interestExpenses. Not a percentage.
    CategoryAggregate:
      type: object
      required: [category, amountMinor, percent]
      properties:
        category:
          type: string
        amountMinor:
          type: integer
        percent:
          type: number
          description: Share of this category within its own top-categories list (expenses vs. incomes are two separate 100% totals).
    KpiReport:
      type: object
      required:
        - period
        - previousPeriod
        - ratios
        - previousRatios
        - dashboardSavingsRatePercent
        - previousDashboardSavingsRatePercent
        - dashboardFixedCostRatioPercent
        - previousDashboardFixedCostRatioPercent
        - topExpenses
        - topIncomes
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        ratios:
          $ref: '#/components/schemas/KeyRatios'
        previousRatios:
          $ref: '#/components/schemas/KeyRatios'
        dashboardSavingsRatePercent:
          type: number
        previousDashboardSavingsRatePercent:
          type: number
        dashboardFixedCostRatioPercent:
          type: number
        previousDashboardFixedCostRatioPercent:
          type: number
        topExpenses:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
        topIncomes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
    MojoStatus:
      type: object
      required: [amountMinor, targetMinor, remainingMinor, percentFilled]
      properties:
        amountMinor:
          type: integer
          description: Derived from transaction history — not directly writable.
        targetMinor:
          type: integer
        remainingMinor:
          type: integer
          description: max(0, targetMinor - amountMinor).
        percentFilled:
          type: number
          description: amountMinor / targetMinor * 100, or 0 when targetMinor is 0. Not clamped to 100.
    FireCoverageReport:
      type: object
      required: [coverageRatio, mojoAmountMinor, averageMonthlyExpensesMinor, monthsConsidered]
      properties:
        coverageRatio:
          type: number
          nullable: true
          description: mojoAmountMinor / averageMonthlyExpensesMinor. null when monthsConsidered is 0 — there's no expense baseline to divide by, not a fabricated ratio.
        mojoAmountMinor:
          type: integer
        averageMonthlyExpensesMinor:
          type: integer
          description: Average Daily/Splurge/Smile/Fire expense-account spending per historical calendar month, excluding transfers and the current (incomplete) month.
        monthsConsidered:
          type: integer
          description: Distinct calendar months, excluding the current one, with at least one qualifying expense — the denominator's sample size.
    FundProjectTotals:
      type: object
      required: [targetMinor, amountMinor, remainingMinor, percentFilled]
      properties:
        targetMinor:
          type: integer
        amountMinor:
          type: integer
        remainingMinor:
          type: integer
          description: max(0, targetMinor - amountMinor).
        percentFilled:
          type: number
          description: amountMinor / targetMinor * 100, or 0 when targetMinor is 0.
    FundLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
    FundNote:
      type: object
      required: [text, createdAt]
      properties:
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    FundActionItem:
      type: object
      required: [text, done, priority]
      properties:
        text:
          type: string
        done:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
    SmileBucket:
      type: object
      required: [id, title, targetMinor, amountMinor]
      properties:
        id:
          type: string
        title:
          type: string
        targetMinor:
          type: integer
        amountMinor:
          type: integer
        notes:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
    SmileProject:
      type: object
      required:
        - id
        - title
        - sub
        - phase
        - description
        - buckets
        - totals
        - links
        - actionItems
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SmileBucket'
        totals:
          $ref: '#/components/schemas/FundProjectTotals'
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/FundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/FundNote'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSmileProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
          default: idea
        description:
          type: string
        targetDate:
          type: string
          format: date
        targetMinor:
          type: integer
          description: Creates a single default bucket named after `title`. Either this or a non-empty `buckets` is required.
        amountMinor:
          type: integer
          description: Only used together with `targetMinor`; defaults to 0.
        buckets:
          type: array
          items:
            type: object
            required: [title, targetMinor]
            properties:
              title:
                type: string
              targetMinor:
                type: integer
              amountMinor:
                type: integer
                default: 0
              notes:
                type: string
              targetDate:
                type: string
                format: date
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundNote'
    CreateFundActionItem:
      type: object
      required: [text]
      properties:
        text:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        dueDate:
          type: string
          format: date
      description: '`done` is not accepted here — a newly created action item always starts undone.'
    CreateFundNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
      description: '`createdAt` is not accepted here — always server-stamped at creation time, ignoring any client-supplied value.'
    UpdateFundBucket:
      type: object
      required: [title, targetMinor]
      properties:
        id:
          type: string
          description: Echo back an existing bucket's id to edit it in place; omit to create a new bucket. Two buckets in the same patch cannot request the same id.
        title:
          type: string
        targetMinor:
          type: integer
        amountMinor:
          type: integer
          default: 0
        notes:
          type: string
        targetDate:
          type: string
          format: date
    UpdateFundNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Echo back an existing note's createdAt to preserve it; omit on a new note for a fresh server timestamp.
    UpdateFundActionItem:
      type: object
      required: [text, done]
      properties:
        text:
          type: string
        done:
          type: boolean
          description: Required here (unlike creation) — this replaces the whole array, so an already-done item's state must be echoed back explicitly or it is lost, not defaulted to false.
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
    PatchSmileProjectRequest:
      type: object
      description: All fields optional — send only what you want to change. Unrecognized fields are rejected.
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
          type: array
          minItems: 1
          description: Replaces the entire buckets array.
          items:
            $ref: '#/components/schemas/UpdateFundBucket'
        links:
          type: array
          description: Replaces the entire links array.
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          description: Replaces the entire actionItems array. `done` is required on every item — see UpdateFundActionItem.
          items:
            $ref: '#/components/schemas/UpdateFundActionItem'
        notes:
          type: array
          description: Replaces the entire notes array.
          items:
            $ref: '#/components/schemas/UpdateFundNote'
    FireBucket:
      type: object
      required: [id, title, targetMinor, amountMinor]
      properties:
        id:
          type: string
        title:
          type: string
        targetMinor:
          type: integer
        amountMinor:
          type: integer
        notes:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
    FireProject:
      type: object
      required:
        - id
        - title
        - sub
        - phase
        - description
        - buckets
        - totals
        - links
        - actionItems
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/FireBucket'
        totals:
          $ref: '#/components/schemas/FundProjectTotals'
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/FundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/FundNote'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateFireProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
          default: idea
        description:
          type: string
        targetDate:
          type: string
          format: date
        targetMinor:
          type: integer
          description: Creates a single default bucket named after `title`. Either this or a non-empty `buckets` is required.
        amountMinor:
          type: integer
          description: Only used together with `targetMinor`; defaults to 0.
        buckets:
          type: array
          items:
            type: object
            required: [title, targetMinor]
            properties:
              title:
                type: string
              targetMinor:
                type: integer
              amountMinor:
                type: integer
                default: 0
              notes:
                type: string
              targetDate:
                type: string
                format: date
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundNote'
    PatchFireProjectRequest:
      type: object
      description: All fields optional — send only what you want to change. Unrecognized fields are rejected.
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
          type: array
          minItems: 1
          description: Replaces the entire buckets array.
          items:
            $ref: '#/components/schemas/UpdateFundBucket'
        links:
          type: array
          description: Replaces the entire links array.
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          description: Replaces the entire actionItems array. `done` is required on every item — see UpdateFundActionItem.
          items:
            $ref: '#/components/schemas/UpdateFundActionItem'
        notes:
          type: array
          description: Replaces the entire notes array.
          items:
            $ref: '#/components/schemas/UpdateFundNote'
    CreateTransactionRequest:
      type: object
      required: [account, amountMinor, date, time, category, comment]
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    UpdateTransactionRequest:
      type: object
      minProperties: 1
      description: At least one field must be provided. Unrecognized fields are rejected.
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    CopyTransactionRequest:
      type: object
      description: All fields are optional overrides applied on top of the source transaction. Unrecognized fields are rejected.
      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    BatchTransactionOperation:
      type: object
      required: [op]
      description: |
        A `create` operation takes the same fields as `CreateTransactionRequest` plus `op`.
        An `update` operation takes `id` plus one or more of `CreateTransactionRequest`'s fields (partial, like PATCH).
        A `delete` operation takes only `op` and `id`.
      properties:
        op:
          type: string
          enum: [create, update, delete]
        id:
          type: string
          description: Required for update and delete; not accepted for create.
        account:
          type: string
        amountMinor:
          type: integer
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    BatchTransactionsRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchTransactionOperation'
        atomic:
          type: boolean
          default: false
          description: When true, no operation is applied if any operation in the batch fails.
    BatchTransactionResult:
      type: object
      required: [op, status]
      properties:
        op:
          type: string
          enum: [create, update, delete]
        status:
          type: string
          enum: [created, updated, deleted, error, not_applied]
        id:
          type: string
        transaction:
          $ref: '#/components/schemas/ApiTransaction'
        error:
          type: string
    BatchTransactionsResponse:
      type: object
      required: [idempotencyKey, atomic, itemCount, results]
      properties:
        idempotencyKey:
          type: string
        atomic:
          type: boolean
        itemCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchTransactionResult'
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
  responses:
    AuthenticationRequired:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_required
            title: Authentication required
            status: 401
            detail: Provide a session or PAT.
            code: auth_required
    SessionRequired:
      description: An authenticated account session is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/auth_session_required
            title: Session authentication required
            status: 403
            detail: An authenticated account session is required for this operation.
            code: auth_session_required
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/validation_invalid
            title: Invalid token request
            status: 400
            detail: At least one scope is required.
            code: validation_invalid
    InsufficientScope:
      description: The supplied token does not grant the required scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/scope_insufficient
            title: Insufficient scope
            status: 403
            detail: This operation requires the 'transactions:r' scope.
            code: scope_insufficient
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/not_found
            title: Token not found
            status: 404
            detail: No matching token exists.
            code: not_found
    IdempotencyConflict:
      description: The Idempotency-Key was already used for a request with a different body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://money-manager.dev/problems/conflict_idempotency_mismatch
            title: Idempotency key reused with a different request
            status: 409
            detail: This Idempotency-Key was already used for a request with a different body.
            code: conflict_idempotency_mismatch
