      properties:
        account:
          type: string
        amountMinor:
          type: integer
          not:
            enum: [0]
          description: Integer minor units. Must not be zero.
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    CopyTransactionRequest:
