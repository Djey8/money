openapi: 3.1.0
info:
  title: Money Manager Pro API
  version: 1.0.0-draft
servers:
  - url: /api/v1
paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      description: Returns the caller's transactions in integer minor units. Existing records must first receive stable IDs through `mm-admin migrate-transaction-ids`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: account
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, amount]
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Transactions owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTransaction'
              example:
                transactions:
                  - id: tx_01234567-89ab-cdef-0123-456789abcdef
                    account: Daily
                    amountMinor: -1250
                    currency: EUR
                    date: '2026-09-06'
                    time: '09:30'
                    category: '@Groceries'
                    comment: Weekly shop
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: createTransaction
      summary: Create a transaction
      description: Adds a transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              account: Daily
              amountMinor: -1250
              date: '2026-09-06'
              time: '09:30'
              category: '@Groceries'
              comment: Weekly shop
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /transactions/export:
    get:
      operationId: exportTransactions
      summary: Export all transactions as newline-delimited JSON
      description: Returns every transaction owned by the caller, one JSON object per line (no pagination, no filters), for full-account moves. Requires `transactions:bulk`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Newline-delimited JSON, one ApiTransaction per line
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |-
                {"id":"tx_01234567-89ab-cdef-0123-456789abcdef","account":"Daily","amountMinor":-1250,"currency":"EUR","date":"2026-09-06","time":"09:30","category":"@Groceries","comment":"Weekly shop"}
                {"id":"tx_11111111-89ab-cdef-0123-456789abcdef","account":"Income","amountMinor":250000,"currency":"EUR","date":"2026-09-01","time":"08:00","category":"@Salary","comment":""}
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /transactions/import:
    post:
      operationId: importTransactions
      summary: Bulk-create transactions from newline-delimited JSON
      description: >-
        Creates one transaction per line of the request body (each line the same shape as CreateTransactionRequest).
        Requires `transactions:bulk` and an `Idempotency-Key` header — hashed from the raw request body, not a
        re-serialized JSON value like batch, so byte-identical replay is required (see docs/api/AGENTS.md) — with
        the same replay/mismatch contract and the same known write-then-record ordering gap as
        `POST /transactions/batch`. Up to 10,000 lines of at most 16KB each per call. `?atomic=true` makes the whole
        import all-or-nothing, same as batch's `atomic` flag; the default applies what parses and validates,
        reporting the rest per line as `error`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: atomic
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |-
              {"account":"Daily","amountMinor":-850,"date":"2026-09-07","time":"08:15","category":"@Coffee","comment":""}
              {"account":"Income","amountMinor":250000,"date":"2026-09-01","time":"08:00","category":"@Salary","comment":""}
      responses:
        '200':
          description: Per-line results, in the same shape as a batch response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransactionsResponse'
              example:
                idempotencyKey: 2026-09-07-restore
                atomic: false
                itemCount: 2
                results:
                  - op: create
                    status: created
                    id: tx_22222222-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_22222222-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amountMinor: -850
                      currency: EUR
                      date: '2026-09-07'
                      time: '08:15'
                      category: '@Coffee'
                      comment: ''
                  - op: create
                    status: created
                    id: tx_33333333-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_33333333-89ab-cdef-0123-456789abcdef
                      account: Income
                      amountMinor: 250000
                      currency: EUR
                      date: '2026-09-01'
                      time: '08:00'
                      category: '@Salary'
                      comment: ''
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /transactions/batch:
    post:
      operationId: batchTransactions
      summary: Create, update, or delete many transactions in one request
      description: >-
        Applies a mix of create/update/delete operations atomically at the storage level (one document write) and
        rebuilds derived income/expense/Smile/Fire/Mojo state once. Requires the `transactions:bulk` scope and an
        `Idempotency-Key` header — replaying the same key with the same body returns the original result without
        reapplying it; replaying it with a different body is rejected. The write and the idempotency record are not
        one atomic transaction: a crash between them (rare) can make a same-key retry reapply the batch — see
        docs/api/AGENTS.md. Setting `atomic` to true makes the whole batch all-or-nothing (if any operation fails,
        none are applied, and a would-have-succeeded `create`'s `id` in the response was never persisted); the
        default, false, applies what succeeds and reports failures per item.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransactionsRequest'
            example:
              atomic: false
              operations:
                - op: create
                  account: Daily
                  amountMinor: -850
                  date: '2026-09-07'
                  time: '08:15'
                  category: '@Coffee'
                  comment: ''
                - op: update
                  id: tx_01234567-89ab-cdef-0123-456789abcdef
                  amountMinor: -1500
                - op: delete
                  id: tx_11111111-89ab-cdef-0123-456789abcdef
      responses:
        '200':
          description: Per-item results (some items may report `error` even on a 200, in non-atomic mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransactionsResponse'
              example:
                idempotencyKey: 2026-09-07-morning-batch
                atomic: false
                itemCount: 3
                results:
                  - op: create
                    status: created
                    id: tx_22222222-89ab-cdef-0123-456789abcdef
                    transaction:
                      id: tx_22222222-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amountMinor: -850
                      currency: EUR
                      date: '2026-09-07'
                      time: '08:15'
                      category: '@Coffee'
                      comment: ''
                  - op: update
                    status: error
                    id: tx_01234567-89ab-cdef-0123-456789abcdef
                    error: No matching transaction exists.
                  - op: delete
                    status: deleted
                    id: tx_11111111-89ab-cdef-0123-456789abcdef
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /transactions/{transactionId}/copy:
    post:
      operationId: copyTransaction
      summary: Copy a transaction
      description: Creates a new transaction from an existing one's account, amount, category, and comment. Date and time default to now, matching the UI's copy behavior; any field may be overridden in the request body. Atomically rebuilds derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTransactionRequest'
            example:
              date: '2026-09-07'
      responses:
        '201':
          description: The newly created copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_11111111-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-07'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Get one transaction
      description: Returns a single transaction owned by the caller in integer minor units.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1250
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTransaction
      summary: Edit a transaction
      description: Updates one or more fields on an existing transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state. If the transaction's comment carries a `#bucket:` allocation tag (current or incoming), `amountMinor` and `comment` must be provided together — sending only one is rejected rather than silently applied against the other field's stale value.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
            example:
              amountMinor: -1500
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTransaction'
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
                account: Daily
                amountMinor: -1500
                currency: EUR
                date: '2026-09-06'
                time: '09:30'
                category: '@Groceries'
                comment: Weekly shop
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction
      description: Removes a transaction and atomically rebuilds its derived income, expense, Smile, Fire, and Mojo state.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              example:
                id: tx_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/income-statement:
    get:
      operationId: getIncomeStatement
      summary: Get the income statement for a period
      description: >-
        Computes revenues, interest/property/other income, per-account expenses, net result, and savings rate for one
        period, plus the same figures for the immediately preceding period of the same length. Inter-account
        transfers (Income→Daily/Splurge/Smile/Fire/Mojo) are excluded from both sides, matching
        `src/app/stats/statement/statement-calculations.ts` — see PLAN.md D-22 for why this differs from the
        `src/app/main/cashflow/*` components' own (buggy, out-of-scope) calculation.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Income statement for the requested period and the one before it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeStatement'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                revenues: { current: 250000, previous: 250000, changePercent: 0 }
                interests: { current: 500, previous: 0, changePercent: 0 }
                propertyIncome: { current: 0, previous: 0, changePercent: 0 }
                otherIncome: { current: 0, previous: 0, changePercent: 0 }
                totalIncome: { current: 250500, previous: 250000, changePercent: 0.2 }
                expensesByAccount:
                  Daily: { current: 40000, previous: 38000, changePercent: 5.26 }
                  Splurge: { current: 0, previous: 0, changePercent: 0 }
                  Smile: { current: 0, previous: 0, changePercent: 0 }
                  Fire: { current: 0, previous: 0, changePercent: 0 }
                totalExpenses: { current: 40000, previous: 38000, changePercent: 5.26 }
                netResult: { current: 210500, previous: 212000, changePercent: -0.71 }
                savingsRatePercent: { current: 84.03, previous: 84.8, changePercent: -0.91 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/cashflow:
    get:
      operationId: getCashflow
      summary: Get the cashflow statement for a period
      description: >-
        Splits all activity in one period into operating, investing (transfers into Smile/Fire), financing
        (liability paybacks, detected via a `payback liabilitie` comment substring), and mojo (Mojo contributions),
        plus net cashflow, for the requested period and the one before it. Matches
        `src/app/stats/statement/statement-calculations.ts`'s `computeCashflow` — see PLAN.md D-22. Unlike
        `/reports/income-statement`, this classifies every transaction regardless of account, not only
        Income/expense-account activity.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Cashflow statement for the requested period and the one before it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowStatement'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                operating: { current: 210500, previous: 212000, changePercent: -0.71 }
                investing: { current: 30000, previous: 20000, changePercent: 50 }
                financing: { current: 15000, previous: 0, changePercent: 0 }
                mojo: { current: 5000, previous: 5000, changePercent: 0 }
                netCashflow: { current: 160500, previous: 187000, changePercent: -14.17 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      summary: Get the current balance sheet
      description: >-
        A current snapshot of assets, liabilities, and equity — not period-scoped, unlike the other report
        endpoints, matching `computeBalanceSheet` in `src/app/stats/statement/statement-calculations.ts` (canonical
        per PLAN.md D-22). `assets.shares` is each share's `quantity × price`; `assets.investments` is each
        investment's `amount + deposit`; `equity`/`netWorth` is total assets minus total liabilities and can be
        negative.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current balance sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheet'
              example:
                assets:
                  cash: 800000
                  shares: 415000
                  investments: 21000000
                  properties: 80000
                  total: 22295000
                liabilities:
                  debts: 15000000
                  total: 15000000
                equity: 7295000
                netWorth: 7295000
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/kpis:
    get:
      operationId: getKpis
      summary: Get key ratios, top categories, and both KPI-dashboard variants for a period
      description: >-
        Ports `computeRatiosForRange`/`topCategories` from `src/app/stats/statement/statement-calculations.ts`
        (`ratios`/`previousRatios`/`topExpenses`/`topIncomes`) plus, per PLAN.md D-7/D-23,
        `dashboardSavingsRatePercent` and `dashboardFixedCostRatioPercent` — a second, genuinely different pair of
        formulas from `src/app/stats/stats-calculations.ts`'s KPI dashboard (STATS-1). The two savings-rate values
        and the two fixed-cost-ratio values are each independently computed and exposed distinctly named on purpose
        — see `docs/domain/KPI_FORMULAS.md` for their exact formulas and where/why they diverge.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, halfyear, year]
            default: month
        - name: offset
          in: query
          description: Periods before the current one; 0 is the period containing today, -1 the one before it, and so on.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: KPI ratios, top categories, and dashboard-formula ratios for the requested period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiReport'
              example:
                period:
                  startDate: '2026-09-01'
                  endDate: '2026-09-30'
                  label: Sep 2026
                previousPeriod:
                  startDate: '2026-08-01'
                  endDate: '2026-08-31'
                  label: Aug 2026
                ratios:
                  savingsRatePercent: 84.03
                  fixedCostRatioPercent: 32.5
                  netMarginPercent: 84.03
                  debtRatio: 0.4
                  equityRatioPercent: 42.86
                  interestCoverage: 5.2
                previousRatios:
                  savingsRatePercent: 84.8
                  fixedCostRatioPercent: 30.1
                  netMarginPercent: 84.8
                  debtRatio: 0.41
                  equityRatioPercent: 41.9
                  interestCoverage: 4.9
                dashboardSavingsRatePercent: 82.1
                previousDashboardSavingsRatePercent: 83.4
                dashboardFixedCostRatioPercent: 29.8
                previousDashboardFixedCostRatioPercent: 28.2
                topExpenses:
                  - category: Groceries
                    amountMinor: 45000
                    percent: 62.5
                  - category: Fun
                    amountMinor: 27000
                    percent: 37.5
                topIncomes:
                  - category: Salary
                    amountMinor: 250000
                    percent: 100
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /reports/fire-coverage:
    get:
      operationId: getFireCoverage
      summary: Get the Fire emergency-fund coverage ratio
      description: >-
        Ports `getEmergencyCoverage`/`getAverageMonthlyExpenses` from `src/app/main/fire/fire.component.ts` (FIRE-2's
        gauge: how many months of average expenses the Mojo reserve covers). A current snapshot, not period-scoped,
        like `/reports/balance-sheet` — the endpoint itself decides which historical months to average over
        (every calendar month with qualifying expense-account spending, excluding the current, necessarily
        incomplete month). Four deliberate corrections versus the original UI gauge, made because this is the first
        time this calculation has been ported into the API/domain package (see `docs/domain/FIRE_COVERAGE_FORMULA.md`
        for the full rationale and a worked example): expense-account transfers (e.g. an `Income → Smile`
        contribution) and `Mojo`-account transactions are excluded from the average, refunds (positive amounts on an
        expense account) are excluded rather than netted, and `coverageRatio` is `null` rather than a fabricated number
        when there's no expense history yet to average.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fire coverage ratio and its inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireCoverageReport'
              example:
                coverageRatio: 3.2
                mojoAmountMinor: 480000
                averageMonthlyExpensesMinor: 150000
                monthsConsidered: 8
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /mojo:
    get:
      operationId: getMojo
      summary: Get the current Mojo status
      description: >-
        Mojo is a single shared emergency/long-term reserve, not a list — there is one Mojo balance per user.
        `remainingMinor` and `percentFilled` are read-side conveniences on top of the raw `amountMinor`/`targetMinor`
        pair; `amountMinor` is derived from transaction history (see `PUT /mojo`) and is not itself writable.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current Mojo status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MojoStatus'
              example:
                amountMinor: 150000
                targetMinor: 200000
                remainingMinor: 50000
                percentFilled: 75
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    put:
      operationId: updateMojoTarget
      summary: Update the Mojo target
      description: >-
        Updates only `targetMinor` — `amountMinor` is owned by transaction-derived state (a `@Mojo`-tagged
        contribution or a direct transaction on the `Mojo` account) and cannot be set directly here, matching the
        UI's own Mojo editor (only the target is user-editable).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetMinor]
              properties:
                targetMinor:
                  type: integer
                  minimum: 1
            example:
              targetMinor: 200000
      responses:
        '200':
          description: Updated Mojo status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MojoStatus'
              example:
                amountMinor: 150000
                targetMinor: 200000
                remainingMinor: 50000
                percentFilled: 75
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /smile:
    get:
      operationId: listSmileProjects
      summary: List Smile projects
      description: >-
        Returns every Smile project owned by the caller. Existing projects must first receive stable IDs through
        `mm-admin migrate-fund-project-ids --collection smile` (the legacy storage shape has no project-level id,
        only bucket-level ids). `totals` is a read-side aggregate (`packages/domain`'s `computeProjectTotals`) summed
        across all of a project's buckets — not stored, computed on every read.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Smile projects owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/SmileProject'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: createSmileProject
      summary: Create a Smile project
      description: >-
        Either `targetMinor` (optionally with `amountMinor`, becoming a single default bucket named after the
        project's title) or a non-empty `buckets` array is required — matching the UI's own Add Smile form, which
        accepts either a flat target or custom buckets and merges both if given. `title` must not exactly match
        (case-sensitively — the UI's own duplicate check is exact-match, not case-insensitive) an existing Smile
        project's title.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmileProjectRequest'
            example:
              title: Summer Vacation
              phase: saving
              buckets:
                - title: Flights
                  targetMinor: 150000
                - title: Hotel
                  targetMinor: 80000
      responses:
        '201':
          description: Created Smile project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileProject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /smile/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSmileProject
      summary: Get a single Smile project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Smile project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileProject'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSmileProject
      summary: Update a Smile project
      description: >-
        Accepts a partial body — only the fields you send are changed. `buckets`/`links`/`actionItems`/`notes`, when
        sent, each REPLACE the entire array (not a per-item merge) — send the complete list you want, including
        unchanged entries. For `buckets`, echo back an existing bucket's `id` to edit it in place; omit `id` (or use
        one that doesn't match) to add a new bucket — any existing bucket whose `id` isn't present in the new array
        is dropped. For `notes`, echo back an existing note's `createdAt` to preserve it; omit it on a new note to
        get a fresh server timestamp. A changed `title` is checked for an exact-match collision against the
        caller's other Smile projects (not against itself). Moving `phase` to `completed` stamps `completionDate`
        automatically if one isn't already set; it never overwrites an explicit `completionDate` sent in the same
        request, and moving away from `completed` never clears a previously-set `completionDate`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSmileProjectRequest'
            example:
              phase: ready
      responses:
        '200':
          description: Updated Smile project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileProject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSmileProject
      summary: Delete a Smile project
      description: Not reversible through the API.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              example:
                id: smile_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /fire:
    get:
