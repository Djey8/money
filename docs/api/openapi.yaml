    GrowLiabilitieAttachment:
      type: object
      required: [loanMinor, creditMinor]
      description: An optional financing loan attached to a buy, tagged with the grow project's own title — distinct from an Investment's own `M-<title>` mortgage liability.
      properties:
        loanMinor:
          type: integer
        creditMinor:
          type: integer
    BuyGrowRequest:
      type: object
      description: >-
        Required fields depend on the grow project's own fixed kind: `asset` needs `totalAmountMinor`; `share`
        needs `quantity` (may be fractional, e.g. crypto) and `priceMinor` (per unit); `investment` needs
        `depositMinor`, plus an optional `mortgageMinor` (default 0 — a cash-only purchase). `quantity * priceMinor`
        is rounded half away from zero to whole minor units. A body shaped for the wrong kind is rejected with
        `validation_invalid`.
      properties:
        totalAmountMinor:
          type: integer
        quantity:
          type: number
        priceMinor:
          type: integer
        depositMinor:
          type: integer
        mortgageMinor:
          type: integer
        liabilitie:
          $ref: '#/components/schemas/GrowLiabilitieAttachment'
        date:
          type: string
          format: date
          description: Defaults to today when omitted.
        time:
          type: string
          description: Defaults to the current time when omitted.
    SellGrowRequest:
      type: object
      description: >-
        Same kind-dependent shape as BuyGrowRequest for totalAmountMinor / quantity+priceMinor / depositMinor+mortgageMinor.
        For an investment-kind sell, `depositMinor` and `mortgageMinor` each default to 0 but must not both be 0.
        An investment-kind sell may also include `payback` to settle an attached liability atomically with the sale.
      properties:
        totalAmountMinor:
          type: integer
        quantity:
          type: number
        priceMinor:
          type: integer
        depositMinor:
          type: integer
        mortgageMinor:
          type: integer
        payback:
          type: object
          required: [amountMinor, creditMinor]
          properties:
            amountMinor:
              type: integer
            creditMinor:
              type: integer
        date:
          type: string
          format: date
        time:
          type: string
    DividendGrowRequest:
      type: object
      required: [quantity, priceMinor]
      properties:
        quantity:
          type: number
        priceMinor:
          type: integer
        date:
          type: string
          format: date
        time:
          type: string
    PaybackGrowRequest:
      type: object
      required: [amountMinor, creditMinor]
      properties:
        amountMinor:
          type: integer
        creditMinor:
          type: integer
        date:
          type: string
          format: date
        time:
          type: string
    CashflowGrowRequest:
