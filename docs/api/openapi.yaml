                  grow:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grow'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: createGrow
      summary: Create a grow project
      description: >-
        `title` must not collide with an existing grow project's title (GROW-2). `isAsset`/`share`/`investment` are
        mutually exclusive booleans marking this project's fixed kind — once set, it determines which typed-action
        request shape `POST /grow/{growId}/buy` and `.../sell` expect, and cannot be changed afterwards. `amountMinor`
        and `cashflowMinor` always start at 0 and `liabilitie` starts `null` — they're only ever changed by the typed
        action endpoints, never by this or `PATCH /grow/{growId}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrowRequest'
            example:
              title: MSFT
              phase: plan
              share: true
      responses:
        '201':
          description: Created grow project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /grow/{growId}:
    parameters:
      - name: growId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGrow
      summary: Get a single grow project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The grow project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grow'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateGrow
      summary: Update a grow project's metadata
      description: >-
        Accepts a partial body — only the fields you send are changed (GROW-3). Money-moving fields
        (`amountMinor`, `cashflowMinor`, `share`, `investment`, `liabilitie`) are rejected here — use the typed
        action endpoints instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGrowRequest'
            example:
              phase: monitor
              riskScore: 4
      responses:
        '200':
          description: Updated grow project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteGrow
      summary: Delete a grow project
      description: Not reversible through the API. Does not delete any linked Asset/Share/Investment/Liability record or past transactions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grow project deleted
          content:
            application/json:
              example:
                id: grow_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /grow/{growId}/buy:
    parameters:
      - name: growId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: buyGrow
      summary: Record a buy against a grow project (GROW-4)
      description: >-
        Generates the same canonical `Transaction.comment` DSL the existing Angular UI reads
        (`docs/domain/GROW_DSL_FORMULA.md`), atomically alongside the Asset/Share/Investment patch and, for an
        attached `liabilitie`, a standalone Liability record tagged with the grow project's own title (reflected
        onto this project's own `liabilitie` field too, so a later `payback` or a `sell` with `payback` has
        something to act on). An Investment-kind buy always creates/updates the companion `M-<title>` mortgage
        liability unconditionally, in addition to and distinct from any attached `liabilitie`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyGrowRequest'
            example:
              quantity: 10
              priceMinor: 41500
      responses:
        '201':
          description: The buy was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowActionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /grow/{growId}/sell:
    parameters:
      - name: growId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: sellGrow
      summary: Record a sale against a grow project (GROW-5)
      description: An investment-kind sell may include `payback` to settle an attached liability atomically with the sale.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellGrowRequest'
            example:
              quantity: 5
              priceMinor: 26000
      responses:
        '201':
          description: The sale was recorded
          content:
            application/json:
