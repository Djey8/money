  /subscriptions/export:
    get:
      operationId: exportSubscriptions
      summary: Export all subscriptions as newline-delimited JSON
      description: Returns every subscription owned by the caller, one JSON object per line. Requires `subscriptions:bulk`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Newline-delimited JSON, one Subscription per line
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |-
                {"id":"subscriptions_01234567-89ab-cdef-0123-456789abcdef","title":"Spotify","account":"Daily","amountMinor":-1000,"startDate":"2026-01-01","endDate":null,"category":"@Streaming","comment":"","frequency":"monthly"}
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /subscriptions/import:
    post:
      operationId: importSubscriptions
      summary: Bulk-create subscriptions from newline-delimited JSON
      description: >-
        Creates one subscription per line of the request body (each line the same shape as CreateSubscriptionRequest).
        Requires `subscriptions:bulk` and an `Idempotency-Key` header, with the same replay/mismatch contract as
        `POST /transactions/import`. Up to 10,000 lines of at most 16KB each per call. `?atomic=true` makes the whole
        import all-or-nothing; the default applies what parses and validates, reporting the rest per line as `error`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: atomic
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |-
              {"account":"Daily","amountMinor":-3000,"startDate":"2026-01-01","category":"@Gym"}
      responses:
        '200':
          description: Per-line results, in the same shape as a batch response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubscriptionsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /subscriptions/batch:
    post:
      operationId: batchSubscriptions
      summary: Create, update, or delete many subscriptions in one request
      description: >-
        Applies a mix of create/update/delete operations in one document write. Requires the `subscriptions:bulk`
        scope and an `Idempotency-Key` header, with the same replay/mismatch contract as `POST /transactions/batch`.
        Deliberately does not cascade the stale-transaction cleanup that `PATCH`/`DELETE /subscriptions/{id}` perform
        on an identity-changing edit — a bulk metadata operation shouldn't have the side effect of silently deleting
        transactions across many subscriptions at once.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSubscriptionsRequest'
            example:
              atomic: false
              operations:
                - op: create
                  account: Daily
                  amountMinor: -3000
                  startDate: '2026-01-01'
                  category: '@Gym'
                - op: update
                  id: subscriptions_01234567-89ab-cdef-0123-456789abcdef
                  amountMinor: -3500
                - op: delete
                  id: subscriptions_11111111-89ab-cdef-0123-456789abcdef
      responses:
        '200':
          description: Per-item results (some items may report `error` even on a 200, in non-atomic mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubscriptionsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /subscriptions/refresh:
    post:
      operationId: refreshSubscriptions
      summary: Generate due transactions from active subscriptions (SUB-4)
      description: >-
        For every subscription whose `startDate` has passed, computes which occurrence dates are due (per
        `frequency`, up to today or `endDate` if it has already passed) and generates a transaction for each one not
        already generated (matched on date/account/amount/category/comment). Generated transactions are appended in
        the same write every other transaction mutation goes through, so Mojo/Smile/Fire fund state and the Income
        accounting rebuild reflect them atomically. A Mojo or Smile-project contribution whose target is already
        fully funded is skipped rather than generated. Idempotent to call repeatedly — a run with nothing newly due
        returns `transactionsCreated: 0` without writing anything.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counts of what this run generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSubscriptionsResponse'
              example:
                transactionsCreated: 2
                subscriptionsProcessed: 3
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSubscription
      summary: Get a single subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSubscription
      summary: Update a subscription (SUB-2)
      description: >-
        Accepts a partial body. If any of title/category/amountMinor/account/comment/startDate/frequency actually
        changes, cascades a cleanup that deletes every existing transaction matching the subscription's OLD identity
        (account+amountMinor+category+comment) — a tighter 4-field match than the original app's 3-field
        account+amount+category match, to avoid deleting unrelated manually-entered transactions that happen to
        coincide on just those three fields. Only deletes; call `POST /subscriptions/refresh` afterward to
        regenerate under the new identity.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSubscriptionRequest'
            example:
              amountMinor: -1200
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription (SUB-3)
      description: Leaves already-generated transactions untouched by default. Pass `?deleteTransactions=true` to also delete every transaction matching this subscription's identity.
      security:
        - bearerAuth: []
      parameters:
        - name: deleteTransactions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Subscription deleted
          content:
            application/json:
              example:
                id: subscriptions_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /budget:
    get:
      operationId: listBudget
      summary: List budget rows (BUD-2, BUD-3)
      description: Returns every budget row owned by the caller, optionally filtered to one month. Existing budget rows must first receive stable IDs through `mm-admin migrate-balance-entity-ids --collection budget`.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          description: Filter to one month, YYYY-MM.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Budget rows owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [budget]
                properties:
                  budget:
                    type: array
                    items:
                      $ref: '#/components/schemas/Budget'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: upsertBudget
      summary: Create or update a budget row for a (month, category) pair (BUD-1)
      description: Upserts by `(date, tag)` — if a row already exists for that month and category, its amount is overwritten in place (keeping its id); otherwise a new row is created. Matches the original app's add-budget form exactly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
            example:
              date: '2026-01'
              tag: '@Groceries'
              amountMinor: 30000
      responses:
        '201':
          description: Created or updated budget row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    delete:
      operationId: deleteBudgetMonth
      summary: Delete every budget row for a month (BUD-7)
      description: Not reversible through the API. No cascade to any other entity.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: How many rows were deleted
          content:
            application/json:
              schema:
                type: object
                required: [month, deletedCount]
                properties:
                  month:
                    type: string
                  deletedCount:
                    type: integer
              example:
                month: '2026-01'
                deletedCount: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /budget/{budgetId}:
    parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBudgetRow
      summary: Get a single budget row
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The budget row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateBudgetRow
      summary: Update a budget row (BUD-2)
      description: Accepts a partial body. Rejects the update if changing `date` or `tag` would collide with another existing row's (date, tag) pair — a new guard the original app never needed since it never exposed an edit-in-place path for a single row.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBudgetRequest'
            example:
              amountMinor: 45000
      responses:
        '200':
          description: Updated budget row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBudgetRow
      summary: Delete a budget row (BUD-2)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Budget row deleted
          content:
            application/json:
              example:
                id: budget_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /budget/fill-forward:
    post:
      operationId: fillForwardBudget
      summary: Fill forward budget rows from the nearest prior populated month (BUD-4)
      description: >-
        Walks backward up to 120 months from `targetMonth` for the nearest month with any row, then chain-fills
        forward month by month to `targetMonth` — each newly-filled month becomes the source for the next step.
        Add-only: never overwrites a row that already exists for a given (date, tag), in an intermediate month or
        the target month. A silent no-op (`rowsAdded: 0`) if no prior month within 120 months has any row at all —
        ported from `plan.component.ts`'s `fill()` exactly, including that silence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetMonth]
              properties:
                targetMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example:
              targetMonth: '2026-04'
      responses:
        '200':
          description: How many rows were added
          content:
            application/json:
              schema:
                type: object
                required: [targetMonth, rowsAdded]
                properties:
                  targetMonth:
                    type: string
                  rowsAdded:
                    type: integer
              example:
                targetMonth: '2026-04'
                rowsAdded: 3
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /budget/copy:
    post:
      operationId: copyBudget
      summary: Copy every budget row from one month into another (BUD-5)
      description: >-
        Copies every row from `fromMonth` into `toMonth`. Unlike fill-forward, this OVERWRITES an existing target
        row's amount if one already matches (date, tag) — a deliberately different behavior from
        `POST /budget/fill-forward`, matching the original app's own two distinct operations
        (`plan.component.ts`'s `copy()`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMonth, toMonth]
              properties:
                fromMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                toMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example:
              fromMonth: '2026-01'
              toMonth: '2026-02'
      responses:
        '200':
          description: How many rows were copied
          content:
            application/json:
              schema:
                type: object
                required: [fromMonth, toMonth, rowsCopied]
                properties:
                  fromMonth:
                    type: string
                  toMonth:
                    type: string
                  rowsCopied:
                    type: integer
              example:
                fromMonth: '2026-01'
                toMonth: '2026-02'
                rowsCopied: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /budget/from-subscriptions:
    post:
      operationId: fromSubscriptionsBudget
      summary: Populate budget rows from active subscriptions (BUD-6)
      description: >-
        For every subscription not on the `Income` account, converts its amount to a real monthly-equivalent by
        frequency (weekly ×52/12, biweekly ×26/12, monthly ×1, quarterly ÷3, yearly ÷12) and sums it into a budget
        row for every calendar month the subscription is active — corrects a real over/under-budgeting bug in the
        original app, which never scales by frequency at all. Unconditionally overwrites any existing row for a
        computed (date, tag) pair. Takes no request body — always evaluates every active subscription on the
        account. See `docs/domain/BUDGET_FROM_SUBSCRIPTIONS_FORMULA.md` for the full formula and worked example.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many budget rows were written
          content:
            application/json:
              schema:
                type: object
                required: [rowsWritten]
                properties:
                  rowsWritten:
                    type: integer
              example:
                rowsWritten: 2
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /settings:
    get:
      operationId: getSettings
      summary: Read the caller's settings (SET-1,2,3,4,5,10)
      description: >-
        Returns the confirmed original-app defaults for any field never explicitly saved. Unlike every other field
        here, `username` is the only profile field owned by this resource — `email` is owned by `PATCH /account`
        (identity-sensitive, session-only) instead, and is rejected as an unknown field if sent here.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              example:
                username: jkluess
                currency: '€'
                theme: light
                language: en
                dateFormat: dd.MM.yyyy
                isEuropeanFormat: true
                allocation:
                  daily: 60
                  splurge: 10
                  smile: 10
                  fire: 20
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    patch:
      operationId: updateSettings
      summary: Update one or more settings fields
      description: >-
        Accepts a partial body — only the fields you send are changed. `allocation` is the one exception: it's
        replaced as a whole unit (send all four of `daily`/`splurge`/`smile`/`fire` together) since a partial ratio
        update can't be validated to sum to 100. Sending `email` (or any other unrecognized field) is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSettingsRequest'
            example:
              theme: dark
              currency: '$'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /encryption-config:
    get:
      operationId: getEncryptionConfig
      summary: Read the caller's encryption configuration (SET-6)
      description: >-
        Never returns the raw key, unlike the legacy session-only `/api/auth/encryption-config` — an MCP tool or
        agent reading this endpoint must never see the plaintext key (ADR-0001). `keyConfigured` reports whether a
        real key is active, without revealing it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's encryption configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionConfig'
              example:
                encryptLocal: true
                encryptDatabase: true
                keyConfigured: true
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    put:
      operationId: updateEncryptionConfig
      summary: Toggle encryption, or set an initial key
      description: >-
        Session-only — never callable with a PAT, regardless of scope, the same restriction already applied to
        `/auth/tokens*`. Despite the PUT verb (kept for consistency with this resource's single-config-object
        shape), accepts a partial body: `encryptLocal`/`encryptDatabase` may be toggled freely, and `key` may be set
        when none is active yet. **Cannot change an already-active key** — the backend has no re-encryption logic,
        so a bare key swap would make all existing encrypted data permanently unreadable; changing an active key
        requires `mm-admin rotate-encryption-key` instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutEncryptionConfigRequest'
            example:
              encryptDatabase: true
      responses:
        '200':
          description: Updated encryption configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Insufficient scope, or a real login session is required (PATs can never call this endpoint)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /data/export:
    get:
      operationId: exportData
      summary: Export the full account document, decrypted (SET-8)
      description: >-
        Wraps the same full-document read the legacy, session-only `GET /api/data/document` does, with two
        deliberate corrections: this always returns plaintext, even when database encryption is on (the legacy
        route returns ciphertext as-stored, since only the Angular client holds the key), and this never includes
        the encryption key or config — the original client-side export bundles the raw key into the downloaded
        file, which this does not replicate. Audited despite being a `GET`, since `data:bulk` is exactly the kind
        of blast-radius scope worth a record of who read a full account dump and when.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The full account document
          content:
            application/json:
              schema:
                type: object
                required: [data, createdAt, updatedAt]
                properties:
                  data:
                    type: object
                    description: Everything under the account's data document (transactions, balances, settings, ...), decrypted.
                  createdAt:
                    type: string
                    format: date-time
                    nullable: true
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
              example:
                data:
                  transactions:
                    - id: tx_01234567-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amount: -12.5
                      date: '2026-09-06'
                      time: '14:00'
                      category: '@Groceries'
                      comment: ''
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-09-06T14:00:00.000Z'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /data/import:
    post:
      operationId: importData
      summary: Replace the entire account with the given data (SET-9)
      description: >-
        Restores what `GET /data/export` produced (or a hand-authored equivalent). Requires `{confirm: true}` —
        this is destructive and replaces every collection. Requires the imported `data.meta.schemaVersion` to
        match the account's current one when an account already exists (this never converts between schema
        versions — that's `mm-admin migrate`'s job). Backs up the pre-import document to disk before overwriting,
        mirroring `mm-admin migrate`'s own backup pattern, so a bad import is manually recoverable by an operator
        with server access. `data.transactions` and every field `applyDerivedState` normally recomputes on a
        transaction write (income totals, Mojo's `amount`, Smile/Fire fund-bucket `amount`) are never trusted
        from the imported document directly — they're always rebuilt from the imported transactions, exactly as
        every other write already does. Requires the `data:bulk` scope and an `Idempotency-Key` header, with the
        same replay/mismatch contract as `POST /transactions/batch`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm, data]
              properties:
                confirm:
                  type: boolean
                  description: Must be `true` — an explicit acknowledgement that this replaces the whole account.
                data:
                  type: object
                  description: The same shape `GET /data/export` returns under its own `data` key.
              example:
                confirm: true
                data:
                  meta:
                    schemaVersion: 1
                    currency: EUR
                  transactions:
                    - id: tx_01234567-89ab-cdef-0123-456789abcdef
                      account: Daily
                      amount: -12.5
                      date: '2026-09-06'
                      time: '14:00'
                      category: '@Groceries'
                      comment: ''
      responses:
        '200':
          description: How many transactions were imported
          content:
            application/json:
              schema:
                type: object
                required: [transactionCount, schemaVersion]
                properties:
                  transactionCount:
                    type: integer
                  schemaVersion:
                    type: integer
                  backupFile:
                    type: string
                    nullable: true
                    description: Path to the pre-import backup on the server, or `null` if no account existed yet.
              example:
                transactionCount: 42
                schemaVersion: 1
                backupFile: /app/backend/migration-backups/user_123-import-2026-09-06T14-00-00-000Z.json
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /data/recalculate:
    post:
      operationId: recalculateData
      summary: Force a full recalculation of derived state from transactions (SET-11)
      description: >-
        The server-side equivalent of the original app's "Fix Accounting" button. Every transaction write already
        runs this same recalculation (accounting totals, Mojo, Smile/Fire fund buckets) automatically — this
        endpoint exists to force it again against whatever is currently stored, without changing any transaction,
        useful after `POST /data/import` or manual data surgery that could have left the derived aggregates stale.
        Requires the `data:bulk` scope and an `Idempotency-Key` header, with the same replay/mismatch contract as
        `POST /transactions/batch`, even though recalculating twice is naturally idempotent in effect.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: How many transactions were recalculated
          content:
            application/json:
              schema:
                type: object
                required: [transactionCount]
                properties:
                  transactionCount:
                    type: integer
              example:
                transactionCount: 42
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /account:
    get:
      operationId: getAccount
      summary: Read the caller's account email (AUTH-6, PROF-1)
      description: >-
        Requires `account:r` — readable via a PAT with any scope holding it, unlike every other operation on this
        resource. Reading the current email isn't identity-sensitive the way changing or deleting the account is.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's account
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
                    format: email
                  createdAt:
                    type: string
                    format: date-time
                    nullable: true
              example:
                email: jkluess@example.com
                createdAt: '2026-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    patch:
      operationId: updateAccount
      summary: Change the account's email (AUTH-6)
      description: >-
        Session-only — never callable with a PAT, regardless of scope, the same restriction already applied to
        `/auth/tokens*` and `PUT /encryption-config`. Rejects an email already used by another account. Reissues
        the session cookie with the new email using the standard 24h lifetime (the legacy, session-only `PUT
        /auth/update-email` had a bug reissuing it with only a 15-minute lifetime — fixed here, and in that route
        too). Also updates `data.info.email` in the same operation, which the legacy route never did, so the two
        copies of the email (`authDb` and the Pro-API-readable `data.info`) never silently diverge.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: new-address@example.com
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Insufficient scope, or a real login session is required (PATs can never call this endpoint)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Email already in use by another account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://money-manager.dev/problems/conflict_email_taken
                title: Invalid account request
                status: 409
                detail: Email already in use by another account.
                code: conflict_email_taken
    delete:
      operationId: deleteAccount
      summary: Permanently delete the account (AUTH-8)
      description: >-
        Session-only, requires `{confirm: true}` — this is destructive and irreversible. Extends the legacy
        `DELETE /auth/delete-account` cascade (which destroys only the `usersDb`/`authDb` documents) to also
        delete every Personal Access Token belonging to the user — left in place, a PAT would otherwise keep
        authenticating after the account it belongs to no longer exists — and to explicitly revoke the current
        refresh token, rather than relying solely on the deleted `authDb` document to eventually invalidate it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
            example:
              confirm: true
      responses:
        '200':
          description: How many Personal Access Tokens were deleted along with the account
          content:
            application/json:
              schema:
                type: object
                required: [deletedTokenCount]
                properties:
                  deletedTokenCount:
                    type: integer
              example:
                deletedTokenCount: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Insufficient scope, or a real login session is required (PATs can never call this endpoint)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /account/verify-password:
    post:
      operationId: verifyAccountPassword
      summary: Verify the account's password (AUTH-7)
      description: >-
        Session-only — never callable with a PAT, regardless of scope. A thin wrapper on the same bcrypt-compare
        logic the legacy, session-only `POST /auth/verify-password` uses, gating sensitive UI actions (e.g.
        viewing/changing encryption settings) the same way.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: The password is correct
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
              example:
                valid: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: The password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A real login session is required (PATs can never call this endpoint)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Identity:
      type: object
      required: [userId, authenticationType, scopes]
      properties:
        userId:
          type: string
        authenticationType:
          type: string
          enum: [session, token]
        tokenName:
          type: string
        scopes:
          type: array
          items:
            type: string
    TokenMetadata:
      type: object
      required: [tokenId, name, scopes, createdAt, expiresAt, revoked]
      properties:
        tokenId:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        expiresInDays:
          type: integer
          minimum: 1
    ApiTransaction:
      type: object
      required: [id, account, amountMinor, currency, date, time, category, comment]
      properties:
        id:
          type: string
        account:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        date:
          type: string
          format: date
        time:
          type: string
        category:
          type: string
        comment:
          type: string
    StatementRow:
      type: object
      required: [current, previous, changePercent]
      description: Amounts are integer minor units. `changePercent` is the relative change of `current` vs `previous` (e.g. 20 → 25 is `25`, not `5`); it is `0` when `previous` is `0`.
      properties:
        current:
          type: integer
        previous:
          type: integer
        changePercent:
          type: number
    IncomeStatement:
      type: object
      required:
        - period
        - previousPeriod
        - revenues
        - interests
        - propertyIncome
        - otherIncome
        - totalIncome
        - expensesByAccount
        - totalExpenses
        - netResult
        - savingsRatePercent
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        revenues:
          $ref: '#/components/schemas/StatementRow'
        interests:
          $ref: '#/components/schemas/StatementRow'
        propertyIncome:
          $ref: '#/components/schemas/StatementRow'
        otherIncome:
          $ref: '#/components/schemas/StatementRow'
        totalIncome:
          $ref: '#/components/schemas/StatementRow'
        expensesByAccount:
          type: object
          required: [Daily, Splurge, Smile, Fire]
          properties:
            Daily:
              $ref: '#/components/schemas/StatementRow'
            Splurge:
              $ref: '#/components/schemas/StatementRow'
            Smile:
              $ref: '#/components/schemas/StatementRow'
            Fire:
              $ref: '#/components/schemas/StatementRow'
        totalExpenses:
          $ref: '#/components/schemas/StatementRow'
        netResult:
          $ref: '#/components/schemas/StatementRow'
        savingsRatePercent:
          $ref: '#/components/schemas/StatementRow'
    PeriodRange:
      type: object
      required: [startDate, endDate, label]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
    CashflowStatement:
      type: object
      required: [period, previousPeriod, operating, investing, financing, mojo, netCashflow]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        operating:
          $ref: '#/components/schemas/StatementRow'
        investing:
          $ref: '#/components/schemas/StatementRow'
        financing:
          $ref: '#/components/schemas/StatementRow'
        mojo:
          $ref: '#/components/schemas/StatementRow'
        netCashflow:
          $ref: '#/components/schemas/StatementRow'
    BalanceSheet:
      type: object
      required: [assets, liabilities, equity, netWorth]
      properties:
        assets:
          type: object
          required: [cash, shares, investments, properties, total]
          properties:
            cash:
              type: integer
            shares:
              type: integer
            investments:
              type: integer
            properties:
              type: integer
            total:
              type: integer
        liabilities:
          type: object
          required: [debts, total]
          properties:
            debts:
              type: integer
            total:
              type: integer
        equity:
          type: integer
          description: Total assets minus total liabilities. Can be negative.
        netWorth:
          type: integer
          description: Alias for `equity`.
    KeyRatios:
      type: object
      required:
        - savingsRatePercent
        - fixedCostRatioPercent
        - netMarginPercent
        - debtRatio
        - equityRatioPercent
        - interestCoverage
      properties:
        savingsRatePercent:
          type: number
        fixedCostRatioPercent:
          type: number
        netMarginPercent:
          type: number
          description: Identical formula/value to `savingsRatePercent` — a pre-existing redundancy ported faithfully from the original.
        debtRatio:
          type: number
          description: liabilities.total / assets.total. Not a percentage.
        equityRatioPercent:
          type: number
        interestCoverage:
          type: number
          description: netResult / interestExpenses. Not a percentage.
    CategoryAggregate:
      type: object
      required: [category, amountMinor, percent]
      properties:
        category:
          type: string
        amountMinor:
          type: integer
        percent:
          type: number
          description: Share of this category within its own top-categories list (expenses vs. incomes are two separate 100% totals).
    KpiReport:
      type: object
      required:
        - period
        - previousPeriod
        - ratios
        - previousRatios
        - dashboardSavingsRatePercent
        - previousDashboardSavingsRatePercent
        - dashboardFixedCostRatioPercent
        - previousDashboardFixedCostRatioPercent
        - topExpenses
        - topIncomes
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        previousPeriod:
          $ref: '#/components/schemas/PeriodRange'
        ratios:
          $ref: '#/components/schemas/KeyRatios'
        previousRatios:
          $ref: '#/components/schemas/KeyRatios'
        dashboardSavingsRatePercent:
          type: number
        previousDashboardSavingsRatePercent:
          type: number
        dashboardFixedCostRatioPercent:
          type: number
        previousDashboardFixedCostRatioPercent:
          type: number
        topExpenses:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
        topIncomes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAggregate'
    MojoStatus:
      type: object
      required: [amountMinor, targetMinor, remainingMinor, percentFilled]
      properties:
        amountMinor:
          type: integer
          description: Derived from transaction history — not directly writable.
        targetMinor:
          type: integer
        remainingMinor:
          type: integer
          description: max(0, targetMinor - amountMinor).
        percentFilled:
          type: number
          description: amountMinor / targetMinor * 100, or 0 when targetMinor is 0. Not clamped to 100.
    FireCoverageReport:
      type: object
      required: [coverageRatio, mojoAmountMinor, averageMonthlyExpensesMinor, monthsConsidered]
      properties:
        coverageRatio:
          type: number
          nullable: true
          description: mojoAmountMinor / averageMonthlyExpensesMinor. null when monthsConsidered is 0 — there's no expense baseline to divide by, not a fabricated ratio.
        mojoAmountMinor:
          type: integer
        averageMonthlyExpensesMinor:
          type: integer
          description: Average Daily/Splurge/Smile/Fire expense-account spending per historical calendar month, excluding transfers and the current (incomplete) month.
        monthsConsidered:
          type: integer
          description: Distinct calendar months, excluding the current one, with at least one qualifying expense — the denominator's sample size.
    GrowPnl:
      type: object
      required: [title, netCashflowMinor, investedMinor, returnedMinor, transactionCount]
      properties:
        title:
          type: string
        netCashflowMinor:
          type: integer
          description: returnedMinor - investedMinor. Numerically identical to the original's own getGrowProjectsGV aggregate.
        investedMinor:
          type: integer
          description: Sum of every matching transaction's negative amountMinor (absolute value).
        returnedMinor:
          type: integer
          description: Sum of every matching transaction's positive amountMinor.
        transactionCount:
          type: integer
    FundProjectTotals:
      type: object
      required: [targetMinor, amountMinor, remainingMinor, percentFilled]
      properties:
        targetMinor:
          type: integer
        amountMinor:
          type: integer
        remainingMinor:
          type: integer
          description: max(0, targetMinor - amountMinor).
        percentFilled:
          type: number
          description: amountMinor / targetMinor * 100, or 0 when targetMinor is 0.
    FundLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
    FundNote:
      type: object
      required: [text, createdAt]
      properties:
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    FundActionItem:
      type: object
      required: [text, done, priority]
      properties:
        text:
          type: string
        done:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
    SmileBucket:
      type: object
      required: [id, title, targetMinor, amountMinor]
      properties:
        id:
          type: string
        title:
          type: string
        targetMinor:
          type: integer
        amountMinor:
          type: integer
        notes:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
    SmileProject:
      type: object
      required:
        - id
        - title
        - sub
        - phase
        - description
        - buckets
        - totals
        - links
        - actionItems
        - notes
        - plannedSubscriptions
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SmileBucket'
        totals:
          $ref: '#/components/schemas/FundProjectTotals'
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/FundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/FundNote'
        plannedSubscriptions:
          type: array
          description: Payment plans created via POST /smile/{id}/payment-plan.
          items:
            $ref: '#/components/schemas/PaymentPlan'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSmileProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
          default: idea
        description:
          type: string
        targetDate:
          type: string
          format: date
        targetMinor:
          type: integer
          description: Creates a single default bucket named after `title`. Either this or a non-empty `buckets` is required.
        amountMinor:
          type: integer
          description: Only used together with `targetMinor`; defaults to 0.
        buckets:
          type: array
          items:
            type: object
            required: [title, targetMinor]
            properties:
              title:
                type: string
              targetMinor:
                type: integer
              amountMinor:
                type: integer
                default: 0
              notes:
                type: string
              targetDate:
                type: string
                format: date
        links:
          type: array
          items:
            $ref: '#/components/schemas/FundLink'
        actionItems:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundActionItem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CreateFundNote'
    CreateFundActionItem:
      type: object
      required: [text]
      properties:
        text:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        dueDate:
          type: string
          format: date
      description: '`done` is not accepted here — a newly created action item always starts undone.'
    CreateFundNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
      description: '`createdAt` is not accepted here — always server-stamped at creation time, ignoring any client-supplied value.'
    UpdateFundBucket:
      type: object
      required: [title, targetMinor]
      properties:
        id:
          type: string
          description: Echo back an existing bucket's id to edit it in place; omit to create a new bucket. Two buckets in the same patch cannot request the same id.
        title:
          type: string
        targetMinor:
          type: integer
        amountMinor:
          type: integer
          default: 0
        notes:
          type: string
        targetDate:
          type: string
          format: date
    UpdateFundNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Echo back an existing note's createdAt to preserve it; omit on a new note for a fresh server timestamp.
    UpdateFundActionItem:
      type: object
      required: [text, done]
      properties:
        text:
          type: string
        done:
          type: boolean
          description: Required here (unlike creation) — this replaces the whole array, so an already-done item's state must be echoed back explicitly or it is lost, not defaulted to false.
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
    PatchSmileProjectRequest:
      type: object
      description: All fields optional — send only what you want to change. Unrecognized fields are rejected.
      properties:
        title:
          type: string
        sub:
          type: string
        phase:
          type: string
          enum: [idea, planning, saving, ready, completed]
        description:
          type: string
        targetDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        buckets:
