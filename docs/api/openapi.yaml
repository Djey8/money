      description: Not reversible through the API.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Investment deleted
          content:
            application/json:
              example:
                id: investments_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /balance/shares:
    get:
      operationId: listShares
      summary: List shares
      description: >-
        Returns every share owned by the caller (SHARE-1/2/3). Existing shares must first receive stable IDs
        through `mm-admin migrate-balance-entity-ids --collection shares`. `tag` shares one namespace with
        Assets/Investments — it must not collide with an Asset, Investment, or another Share's tag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shares owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      operationId: createShare
      summary: Create a share
      description: >-
        `tag` must not collide (case-sensitive exact match) with an existing Asset, Investment, or Share tag.
        Every space is stripped from `tag` before storing or comparing it — a ticker-like tag has no internal
        spaces (a corrected version of the original UI's own space-stripping, which only removed the first space).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
            example:
              tag: MSFT
              quantity: 10
              priceMinor: 41500
      responses:
        '201':
          description: Created share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /balance/shares/{shareId}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShare
      summary: Get a single share
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateShare
      summary: Update a share
      description: >-
        Accepts a partial body — only the fields you send are changed. A changed `tag` is checked for the same
        cross-entity collision `POST /balance/shares` checks (and has every space stripped the same way).
        Renaming a share's `tag` also renames any `income.revenue.interests` entry that matched the old tag.
        Independently of any rename, saving `quantity`/`priceMinor` also syncs the embedded `share.quantity`/
        `share.price` on any Grow project whose `title` equals the (possibly just-renamed) tag — mirroring
        `info-share.component.ts`'s own unconditional sync, done atomically alongside the rest of this write
        instead of as separate, non-atomic writes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchShareRequest'
            example:
              quantity: 20
              priceMinor: 42000
      responses:
        '200':
          description: Updated share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteShare
      summary: Delete a share
      description: Not reversible through the API. Does not clean up any Interest or Grow-project reference that pointed at this share's tag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Share deleted
          content:
            application/json:
              example:
                id: shares_01234567-89ab-cdef-0123-456789abcdef
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
  /income/revenues:
    get:
      operationId: listRevenues
      summary: List revenue sources
      description: >-
        Returns every revenue source owned by the caller (REV-1), read-only. A revenue entry is fully derived from
        transaction history — `POST/PATCH/DELETE /transactions` fully recomputes `revenues`/`interests`/`properties`
        from the *entire* transaction history on every write, with no merge against prior state, so there is no
        durable create/update/delete operation for a revenue entry independent of the transactions that produce it.
        A new tag appears automatically the first time an `@`-tagged transaction posts against it on the `Income`
        account; editing/deleting the underlying transaction is the only way to change or remove one.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Revenue sources owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [revenues]
                properties:
                  revenues:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaggedAmount'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /income/interests:
    get:
      operationId: listInterests
      summary: List interest income sources
      description: >-
        Returns every interest income source owned by the caller (INT-1), read-only — same fully-derived,
        no-durable-direct-edit shape as `GET /income/revenues`. An `@`-tagged Income-account transaction is
        classified as interest income rather than plain revenue when its tag matches an existing Share's tag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Interest income sources owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [interests]
                properties:
                  interests:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaggedAmount'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /income/properties:
    get:
      operationId: listProperties
      summary: List rental property income sources
      description: >-
        Returns every rental property income source owned by the caller (PROP-1), read-only — same fully-derived,
        no-durable-direct-edit shape as `GET /income/revenues`. An `@`-tagged Income-account transaction is
        classified as property income rather than plain revenue when its tag matches an existing Investment's tag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Property income sources owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaggedAmount'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /me:
    get:
      operationId: getCurrentIdentity
      summary: Get the current API identity
      description: Returns the current user's ID, authentication type, and effective scopes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                userId: user_123
                authenticationType: token
                tokenName: household-agent
                scopes: [transactions:rw, reports:r]
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List personal access tokens
      description: Requires an authenticated account session. PATs cannot manage tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens owned by the current user
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
              example:
                tokens:
                  - tokenId: pat_0123456789abcdef0123456789abcdef
                    name: household-agent
                    scopes: [transactions:rw]
                    createdAt: '2026-09-06T20:00:00.000Z'
                    expiresAt: null
                    revoked: false
        '403':
          $ref: '#/components/responses/SessionRequired'
    post:
      operationId: createPersonalAccessToken
      summary: Create a personal access token
      description: Requires an authenticated account session. The plaintext token is returned exactly once; browser-issued tokens cannot receive the admin scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
            example:
              name: household-agent
              scopes: [transactions:rw, reports:r]
              expiresInDays: 90
      responses:
        '201':
          description: Newly created token. Store token securely; it cannot be retrieved again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenMetadata'
                  - type: object
                    required: [token, userId]
                    properties:
                      token:
                        type: string
                        pattern: '^mmpat_[a-f0-9]{64}$'
                      userId:
                        type: string
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                token: mmpat_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                userId: user_123
                name: household-agent
                scopes: [transactions:rw, reports:r]
                expiresAt: '2026-12-05T20:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SessionRequired'
  /auth/tokens/{tokenId}:
    delete:
      operationId: revokePersonalAccessToken
      summary: Revoke a personal access token
      description: Requires an authenticated account session and only revokes a token owned by that user.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                revoked: true
        '403':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/tokens/{tokenId}/purge:
    delete:
      operationId: deletePersonalAccessToken
      summary: Permanently delete a revoked personal access token
      description: |-
        Requires an authenticated account session. Only removes the token document outright — unlike
        `DELETE /auth/tokens/{tokenId}` (revoke), which deliberately keeps a durable record for audit
        purposes. The token must already be revoked; this never accepts an active token, so revocation
        remains the only way to immediately stop a token from working. Intended for a user cleaning up
        their own token list, not as a substitute for revocation.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token permanently deleted
          content:
            application/json:
              example:
                tokenId: pat_0123456789abcdef0123456789abcdef
                deleted: true
        '403':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Token is not revoked yet
          content:
            application/problem+json:
              example:
                type: https://money-manager.dev/problems/conflict_token_not_revoked
                title: Token is not revoked
                status: 409
                detail: Revoke this token before deleting it.
                code: conflict_token_not_revoked
  /grow:
    get:
      operationId: listGrow
      summary: List grow projects
